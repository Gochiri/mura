<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@200;300;400&display=swap');
.mura, .mura *, .mura *::before, .mura *::after { box-sizing: border-box; }
.mura { background: #F0EEE8; color: #1D1B18; font-family: 'Jost', sans-serif; font-weight: 300; margin: 0; -webkit-font-smoothing: antialiased; }
.mura h1, .mura h2, .mura h3, .mura .mura-serif { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; margin: 0; }
.mura p { margin: 0; }
.mura a { color: #1D1B18; text-decoration: none; transition: color .2s ease; }
.mura a:hover { color: #6E6A61; }
.mura-label { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: #8A857B; }
.mura-btn { display: flex; align-items: center; justify-content: center; height: 56px; border: none; background: #1D1B18; color: #F0EEE8 !important; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; font-weight: 300; transition: background .2s ease; width: 100%; }
.mura-btn:hover { background: #38352F; }
.mura-link-u { font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; border-bottom: 1px solid #1D1B18; padding-bottom: 6px; }
.mura-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px,100%),1fr)); gap: clamp(28px,3vw,44px) clamp(14px,1.6vw,22px); }
.mura-card { display: flex; flex-direction: column; gap: 16px; color: #1D1B18 !important; }
.mura-card-img { position: relative; aspect-ratio: 3/4; background: #E3DFD6; overflow: hidden; }
.mura-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mura-badge { position: absolute; top: 14px; left: 14px; background: rgba(240,238,232,.92); padding: 6px 12px; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; }
.mura-card-name { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 500; text-align: center; }
.mura-card-price { font-size: 12px; letter-spacing: .14em; color: #55524B; text-align: center; }
.mura-filtros { display: flex; justify-content: center; gap: clamp(18px,3vw,36px); flex-wrap: wrap; padding: 0 20px clamp(36px,4vw,56px); }
.mura-filtros button { border: none; background: transparent; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; font-weight: 300; color: #8A857B; padding: 10px 2px 8px; border-bottom: 1px solid transparent; }
.mura-filtros button.on { color: #1D1B18; border-bottom-color: #1D1B18; }
.mura-talla { min-width: 52px; height: 48px; padding: 0 14px; border: 1px solid rgba(29,27,24,.25); background: transparent; color: #1D1B18; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: .14em; font-weight: 300; }
.mura-talla.on { border-color: #1D1B18; background: #1D1B18; color: #F0EEE8; }
.mura-talla:disabled { color: #B9B4A9; text-decoration: line-through; cursor: default; }
.mura-acc { border-bottom: 1px solid rgba(29,27,24,.14); }
.mura-acc > button { width: 100%; display: flex; justify-content: space-between; align-items: center; border: none; background: transparent; cursor: pointer; padding: 20px 2px; font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; font-weight: 300; color: #1D1B18; }
.mura-acc > div { display: none; padding: 0 2px 24px; font-size: 13.5px; line-height: 2; color: #55524B; white-space: pre-line; }
.mura-acc.open > div { display: block; }
.mura { width: 100vw; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); overflow-x: clip; }
.mura-qty { display: flex; align-items: center; border: 1px solid rgba(29,27,24,.25); height: 40px; }
.mura-qty button { width: 38px; height: 100%; border: none; background: transparent; cursor: pointer; color: #1D1B18; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 300; line-height: 1; transition: background .2s ease; }
.mura-qty button:hover { background: rgba(29,27,24,.06); }
.mura-qty span { min-width: 34px; text-align: center; font-size: 13px; letter-spacing: .08em; }
.mura-quitar { border: none; background: transparent; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 300; color: #8A857B; padding: 0; }
.mura-quitar:hover { color: #1D1B18; }
.mura-linea { display: flex; gap: 16px; align-items: center; }
.mura-linea-acc { display: flex; align-items: center; gap: clamp(14px,2vw,26px); }
.mura-linea-ir { display: block; }
.mura-linea-ir img { transition: opacity .2s ease; }
.mura-linea-ir:hover img { opacity: .8; }
@media (max-width: 560px) {
  .mura-linea { flex-wrap: wrap; }
  .mura-linea-acc { width: 100%; justify-content: space-between; padding-left: 88px; }
}
</style>
<div class="mura">
<section style="max-width:900px;margin:0 auto;padding:clamp(50px,7vw,90px) clamp(20px,4vw,56px) clamp(80px,10vw,130px)">
<div class="mura-label" style="margin-bottom:14px;text-align:center">Tu selección</div>
<h1 style="font-size:clamp(32px,4vw,52px);margin-bottom:clamp(36px,5vw,56px);text-align:center">Piezas elegidas.</h1>
<div id="mcar-vacio" style="display:none;text-align:center;padding:40px 0 20px">
<p class="mura-serif" style="font-size:22px;font-style:italic;color:#55524B;margin-bottom:26px">Aún no has seleccionado ninguna pieza.</p>
<a href="/prendas" class="mura-link-u">Descubrir colección</a>
</div>
<div id="mcar-list" style="display:flex;flex-direction:column;gap:22px"></div>
<div id="mcar-resumen" style="display:none;border-top:1px solid rgba(29,27,24,.14);margin-top:32px;padding-top:24px">
<div style="display:flex;justify-content:space-between;font-size:15px;margin-bottom:14px"><span>Subtotal</span><span id="mcar-total"></span></div>
<!-- Envío (18/11). Clarity: las clientas se iban sin saber cuánto costaba
     el envío, y MÛRA tiene envío gratis y no lo decía en ningún sitio.
     Tarifas de la zona «España» de la tienda de GHL (leídas por API el
     18/11): a domicilio con Nacex 3 €; recogida en punto Nacex Shop,
     siempre gratis. Desde el 20/11, por decisión de Sara, el envío a
     domicilio es gratis desde 99 € (antes 99,99 €). Si cambian en GHL,
     cambiar ENVIO y GRATIS_DESDE abajo. -->
<div id="mcar-envio" style="font-size:13px;color:#55524B;line-height:1.7;margin-bottom:12px">
<div style="display:flex;justify-content:space-between;gap:16px"><span>Envío a domicilio (Nacex)</span><span id="mcar-envio-casa"></span></div>
<div style="display:flex;justify-content:space-between;gap:16px"><span>Recogida en punto Nacex</span><span>Gratis</span></div>
</div>
<p id="mcar-falta" style="display:none;font-size:12.5px;color:#1D1B18;line-height:1.7;margin:0 0 6px"></p>
<div id="mcar-barra" style="display:none;height:2px;background:rgba(29,27,24,.12);margin:0 0 22px"><div id="mcar-barra-in" style="height:100%;background:#1D1B18;width:0"></div></div>
<div id="mcar-hueco" style="height:12px"></div>
<a href="/checkout" class="mura-btn" id="mcar-cta">Completar pedido</a>
<p style="font-size:11px;color:#8A857B;line-height:1.8;margin-top:16px;text-align:center">Eliges la entrega y pagas de forma segura en el siguiente paso.<br>15 días para devoluciones desde la recepción.</p>
</div>
</section>
<script>(function(){
var KEY='cart_details_rlc7iAyGF4U1nfwAJOJQ';
function fmt(n){
 n=Math.round((Number(n)||0)*100)/100;
 return (n%1===0 ? String(n) : n.toFixed(2).replace('.',',')) + ' €';
}

function getCart(){try{return JSON.parse(localStorage.getItem(KEY)||'{"products":[]}')}catch(e){return {products:[]}}}
function setCart(c){localStorage.setItem(KEY,JSON.stringify(c));render();
 var n=(c.products||[]).reduce(function(a,x){return a+(x.quantity||0)},0);
 document.querySelectorAll('.mura-cart-n').forEach(function(e){e.textContent=n});document.querySelectorAll('.mura-cart-w').forEach(function(e){e.style.display=n>0?'inline':'none'});}
function setQty(i,d){
 var c=getCart(),it=(c.products||[])[i];
 if(!it) return;
 var q=(it.quantity||1)+d;
 if(q<1){c.products.splice(i,1);} else {it.quantity=q;}
 setCart(c);
}

function render(){
 var cart=getCart(),items=cart.products||[],l=document.getElementById('mcar-list');
 document.getElementById('mcar-vacio').style.display=items.length?'none':'block';
 document.getElementById('mcar-resumen').style.display=items.length?'block':'none';
 l.innerHTML='';
 items.forEach(function(it,i){
  var precio=(it.selectedPrice&&it.selectedPrice.amount)||0;
  var talla=(it.selectedPrice&&it.selectedPrice.name)||'Única';
  var cant=it.quantity||1;
  var img=it.selectedProductImage?'<img src="'+it.selectedProductImage+'" alt="'+it.name+'" style="width:72px;height:96px;object-fit:cover;display:block;background:#E3DFD6">':'<div style="width:72px;height:96px;background:#E3DFD6"></div>';
  var ir=it._id?'/producto?id='+encodeURIComponent(it._id):'';
  var nombre='<div class="mura-serif" style="font-size:17px;font-weight:500">'+it.name+'</div>';
  if(ir){
   img='<a class="mura-linea-ir" href="'+ir+'">'+img+'</a>';
   nombre='<a class="mura-linea-ir" href="'+ir+'">'+nombre+'</a>';
  }
  var row=document.createElement('div');
  row.className='mura-linea';
  var unidad = cant>1 ? '<span style="color:#8A857B"> · '+fmt(precio)+' / ud.</span>' : '';
  row.innerHTML=img+'<div style="flex:1">'+nombre+'<div style="font-size:11.5px;color:#8A857B;letter-spacing:.1em;margin:5px 0">Talla '+talla+'</div><div style="font-size:12px;letter-spacing:.1em">'+fmt(precio*cant)+unidad+'</div></div>';

  var acc=document.createElement('div');
  acc.className='mura-linea-acc';

  var qty=document.createElement('div');
  qty.className='mura-qty';
  var menos=document.createElement('button');
  menos.type='button'; menos.textContent='−';
  menos.setAttribute('aria-label','Quitar una unidad de '+it.name);
  menos.onclick=function(){setQty(i,-1)};
  var num=document.createElement('span');
  num.textContent=cant;
  var mas=document.createElement('button');
  mas.type='button'; mas.textContent='+';
  mas.setAttribute('aria-label','Añadir una unidad de '+it.name);
  mas.onclick=function(){setQty(i,1)};
  qty.appendChild(menos); qty.appendChild(num); qty.appendChild(mas);

  var q=document.createElement('button');
  q.type='button'; q.className='mura-quitar'; q.textContent='Quitar';
  q.setAttribute('aria-label','Quitar '+it.name+' del carrito');
  q.onclick=function(){var c=getCart();c.products.splice(i,1);setCart(c)};

  acc.appendChild(qty); acc.appendChild(q);
  row.appendChild(acc); l.appendChild(row);
 });
 var total=items.reduce(function(a,c){return a+((c.selectedPrice&&c.selectedPrice.amount)||0)*(c.quantity||1)},0);
 document.getElementById('mcar-total').textContent=fmt(total);
 envio(total);
}
var ENVIO=3,GRATIS_DESDE=99;
function envio(total){
 var gratis=total>=GRATIS_DESDE,falta=Math.max(0,GRATIS_DESDE-total);
 document.getElementById('mcar-envio-casa').textContent=gratis?'Gratis':fmt(ENVIO);
 var f=document.getElementById('mcar-falta'),b=document.getElementById('mcar-barra');
 if(gratis){f.textContent='Tu envío a domicilio es gratis.';f.style.display='block';b.style.display='none';document.getElementById('mcar-hueco').style.display='block';}
 else{f.textContent='Te faltan '+fmt(falta)+' para el envío gratis a domicilio.';f.style.display='block';b.style.display='block';document.getElementById('mcar-barra-in').style.width=Math.min(100,total/GRATIS_DESDE*100)+'%';document.getElementById('mcar-hueco').style.display='none';}
}
render();
})();</script>
</div>
