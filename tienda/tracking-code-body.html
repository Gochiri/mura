  /* ============================================================
     2.c · Buscador de la rejilla — /prendas /colecciones /novedades
     ============================================================
     Petición de Sonia: "buscador de colección con lupa".

     ⚠️ CÓMO OCULTA, Y POR QUÉ ASÍ
     Esas páginas ya tienen los filtros `.mura-filtros`, que esconden
     y enseñan tarjetas escribiendo en `style.display`. Si el buscador
     escribiera también ahí, el último en tocar ganaría y las dos
     cosas se pisarían: buscar borraría el filtro, filtrar borraría la

     Por eso el buscador NO toca `display`: pone y quita la clase
     `.mura-oculta-busq`, que esconde con `!important`. Las dos capas
     se componen — una tarjeta se ve solo si el filtro la dejó visible
     Y además casa con lo escrito —, y al vaciar la búsqueda reaparece
     lo que el filtro tuviera puesto, sin que haya que recordarlo.

     No hace nada si la página no trae rejilla, así que es inofensivo
     si alguna de esas rutas cambia de forma. */

      '.mura-busq-x:hover { color: #1D1B18; }',

    ].join('\n'));

  function montarBuscador() {
    /* Sin tildes y en minúsculas: quien busca "cardigan" tiene que encontrar
       "Cárdigan", y quien busca "MURA" tiene que encontrar "MÛRA". */
    function llano(s) {
      return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    }

    function arrancar() {
      var grid = document.querySelector('.mura-grid');
      if (!grid || grid.getAttribute('data-busq')) return false;
      var cards = grid.querySelectorAll('.mura-card');
      if (!cards.length) return false;
      grid.setAttribute('data-busq', '1');

      var caja = document.createElement('div');
      caja.className = 'mura-busq';
      caja.innerHTML =
        '<div class="mura-busq-caja">' +
        '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"></circle><line x1="13.5" y1="13.5" x2="18" y2="18"></line></svg>' +
        '<input type="search" id="mura-busq-i" placeholder="Buscar" aria-label="Buscar en la colección" autocomplete="off">' +
        '<button type="button" class="mura-busq-x" id="mura-busq-x" aria-label="Borrar la búsqueda">×</button>' +
        '</div>';

      /* Debajo de los filtros si los hay; si no, justo encima de la rejilla. */
      var filtros = document.querySelector('.mura-filtros');
      if (filtros && filtros.parentNode) filtros.parentNode.insertBefore(caja, filtros.nextSibling);
      else grid.parentNode.insertBefore(caja, grid);

      var nada = document.createElement('p');
      nada.className = 'mura-busq-nada';
      nada.id = 'mura-busq-nada';
      grid.parentNode.insertBefore(nada, grid.nextSibling);

      var input = document.getElementById('mura-busq-i');
      var borrar = document.getElementById('mura-busq-x');

      function filtrar() {
        var q = llano(input.value.trim());
        borrar.style.display = q ? 'block' : 'none';
        var vistas = 0;
        grid.querySelectorAll('.mura-card').forEach(function (c) {
          var nom = c.querySelector('.mura-card-name');
          var texto = llano((nom ? nom.textContent : '') + ' ' + c.textContent);
          var casa = !q || texto.indexOf(q) !== -1;
          c.classList.toggle('mura-oculta-busq', !casa);
          /* Cuenta solo lo que se ve de verdad: una tarjeta que el filtro de
             categoría ya había escondido no es un resultado. */
          if (casa && c.offsetParent !== null) vistas++;
        });
        if (q && vistas === 0) {
          nada.textContent = 'No encontramos ninguna prenda con “' + input.value.trim() + '”. Prueba con otra palabra, o mira la colección entera.';
          nada.style.display = 'block';
        } else {
          nada.style.display = 'none';
        }
      }

      input.addEventListener('input', filtrar);
      borrar.addEventListener('click', function () { input.value = ''; filtrar(); input.focus(); });
      /* Los filtros de categoría se pintan después: al pulsarlos hay que
         recontar, o el mensaje de "no hay resultados" se queda colgado. */
      document.addEventListener('click', function (ev) {
        if (ev.target.closest && ev.target.closest('.mura-filtros')) setTimeout(filtrar, 0);
      });
      return true;
    }

    /* La rejilla puede pintarse después de este script. Se intenta ya, y si
       todavía no está, se espera a que aparezca — con tope, para no dejar un
       observer vivo para siempre en una página que no la trae. */
    if (!arrancar()) {
      var obs = new MutationObserver(function () { if (arrancar()) obs.disconnect(); });
      obs.observe(document.body, { childList: true, subtree: true });
      setTimeout(function () { obs.disconnect(); }, 8000);
    }
  }

  /* ============================================================
     4 · CSS que pisa la tienda de GHL — solo rutas de tienda
     ============================================================
     Aquí se pisa el CSS del elemento de tienda, que no es nuestro.
     En el resto del sitio no hay nada que pisar, y además NO PUEDE
     aplicarse: `body, body *` con `!important` arrasaría con el
     sistema `.mura-*` de nuestras propias páginas. De ahí el
     guardia de rutas.

     Este es el bloque por el que se partió el archivo: es el que
     tarda en llegar si viaja en el Tracking Code del body. */

  /* ============================================================
     Acotar el bloque de tienda al contenido de la página
     ============================================================
     Desde el 22/8 este mismo CSS se pega también en el Custom CSS
     de cada página —es lo único que GHL sirve dentro del <head>—.
     Y ahí no hay guardia de ruta que valga: el CONSTRUCTOR de GHL
     pinta la página en su propio documento, así que un `body { }`
     le repinta también la barra de herramientas al editor.

     Todas las reglas cuelgan de `.hl_page-preview--content`, que
     es el envoltorio del contenido —comprobado en vivo: body >
     #__nuxt > … > #preview-container.hl_page-preview--content >
     … > .hl-store-checkout-container—. En el editor ese envoltorio
     rodea el lienzo y no la barra, así que se ve lo que se edita
     sin teñir la herramienta.

     `:scope` marca las reglas que van SOBRE el envoltorio y no
     dentro (las que antes eran `body`). */
  var RAIZ = '.hl_page-preview--content';

  function acotar(regla) {
    var m = regla.match(/^\s*(@media[^{]+)\{([\s\S]*)\}\s*$/);
    if (m) return m[1] + '{ ' + acotar(m[2].trim()) + ' }';
    var i = regla.indexOf('{');
    if (i === -1) return regla;
    var sels = regla.slice(0, i).split(',').map(function (s) {
      s = s.trim();
      return s.indexOf(':scope') === 0 ? s.replace(':scope', RAIZ) : RAIZ + ' ' + s;
    });
    return sels.join(', ') + ' ' + regla.slice(i);
  }

  var tienda = [

    /* ---------- Base ---------- */
    ':scope { background: #F0EEE8 !important; min-height: 100vh; }',
    ":scope, :scope * { font-family: 'Jost', sans-serif !important; font-weight: 300; }",
    "h1, h2, h3, h4, [class*='title'], .hl-cart-heading, .empty-cart-heading { font-family: 'Cormorant Garamond', Georgia, serif !important; font-weight: 500 !important; color: #1D1B18 !important; background: transparent !important; }",
    'p, span, div, a, li, td { color: #1D1B18; }',
    'img { border-radius: 0 !important; }',
    'svg { color: #55524B; }',
    /* Campos de línea (1/9): sin caja, solo la línea de abajo — el mismo
       idioma que la newsletter de /home, /devolucion y /cancelar_suscripcion.
       Los checkbox/radio se excluyen: son nativos y no llevan línea. */
    'input, select, textarea { border: none !important; border-bottom: 1px solid rgba(29,27,24,.3) !important; border-radius: 0 !important; background: transparent !important; box-shadow: none !important; }',
    'input:focus, select:focus, textarea:focus { outline: none !important; border-bottom-color: #1D1B18 !important; }',
    /* El accent-color va aquí y no solo en el checkbox de facturación:
       el radio de la forma de envío (Nacex) salía en el azul del tema. */
    'input[type=checkbox], input[type=radio] { border: none !important; accent-color: #1D1B18 !important; }',

    /* ---------- Botón de pago ----------
       El `:not(.checkout-breadcrumb-item)` NO es decorativo. Las migas del
       checkout son <button class="checkout-breadcrumb-item">, así que el
       selector de atributo las cazaba y salían como dos botones negros
       enormes: `button[class*='checkout']` (0,1,1) gana por especificidad a
       `.checkout-breadcrumb-item` (0,1,0) aunque las dos lleven !important.
       Se fuerza también el color de TODOS los hijos: el texto vive en un

  /* ============================================================
     9 · Textos de los elementos Cart y Checkout
     ============================================================
     Estos textos son ajustes del elemento y viven en la página, no
     aquí. Lo suyo es cambiarlos ahí —salen bien al primer pintado y
     esto se queda sin trabajo—, pero la API de páginas de GHL no
     tiene ruta de escritura alcanzable: `GET /funnels/page/{id}`
     responde, y todas las de guardado dan «Cannot POST». Así que
     mientras tanto los arregla este bloque.

     Corre en el HEAD y observa desde `documentElement`, así que
     reescribe cada nodo EN CUANTO SE INSERTA, no después de pintar.
     Esa es la diferencia con la versión anterior, que iba en el body
     y repasaba el documento entero en cada mutación: se veía «My
     cart» un instante y costaba más.

     Lo que se toca y por qué:
       · inglés puro          — el elemento Cart tiene sus seis textos
                                sin traducir, y el checkout se dejó el
                                placeholder de las notas.
       · traducción de máquina — el vacío del resumen es el «tumbleweeds»
                                literal de GHL, y encima trata de usted.
       · español de América    — «domicilio», «agregar», «regresar»:
                                la tienda vende en España.
       · el resto              — copia acordada, la que ya estaba escrita
                                en la NOTA del final de este archivo. */

  if (HAY_TRAD && esTienda) traducirTextos();

  function traducirTextos() {
    var exacto = {
      // --- elemento Cart ---
      'My cart': 'Tu selección',
      'My Cart': 'Tu selección',
      'Your Cart is empty': 'Aún no has seleccionado ninguna pieza.',
      'Continue Shopping': 'Descubrir colección',
      'Continue shopping': 'Descubrir colección',
      'Checkout': 'Completar pedido',
      'Qty': 'Ud.',
      'Cant': 'Ud.',
      // --- checkout: migas y secciones ---
      'Contacto y Envío': 'Datos y envío',
      'Regresar a Contacto y Envío': 'Volver a datos y envío',
      'Continuar a pagar': 'Continuar al pago',
      'Email': 'Correo electrónico',
      'Detalles de envío': 'Datos de envío',
      'Detalles del Pago': 'Datos de facturación',
      'Nombre completo': 'Nombre y apellidos',
      'Busca tu domicilio': 'Busca tu dirección',
      'Domicilio completo': 'Dirección completa',
      'Estado / Provincia': 'Provincia',
      'Codigo Postal': 'Código postal',
      'Agregar notas a tu pedido': 'Añadir una nota al pedido',
      'Métodos de envío': 'Forma de envío',
      'Dirección de facturación igual que la de envío':
        'La dirección de facturación es la misma que la de envío',
      '* Pagos 100% seguros y protegidos *': 'Pago seguro',
      // --- checkout: resumen ---
      'Resumen del carrito': 'Tu pedido',
      'Editar carrito': 'Editar',
      'Cupón': 'Código de descuento',
      'Introduce el código del cupón': 'Introduce tu código',
      'Descuento (cupón)': 'Descuento',
      'Eliminar': 'Quitar'
    };

    /* Por prefijo, no exactos: de estos dos no tengo el texto literal
       —el de GHL cambia con la versión— y una coma de diferencia
       dejaría la regla muda sin que nadie se entere. */
    var patrones = [
      [/^Las plantas rodadoras/i, 'Aún no has seleccionado ninguna pieza.'],
      [/^Add notes about your order/i, 'Indicaciones para la entrega'],
      /* El aviso de validación del checkout: trata de usted y no dice
         cuál es el campo — de señalarlo se encarga la sección 10. */
      [/^Cerci[oó]rese de que ha rellenado/i, 'Falta algún dato por completar: revisa los campos marcados.']
    ];

    function traduccion(t) {
      if (!t) return null;
      if (exacto[t]) return exacto[t];
      for (var i = 0; i < patrones.length; i++) {
        if (patrones[i][0].test(t)) return patrones[i][1];
      }
      return null;
    }

    function pasada(nodo) {
      if (!nodo) return;
      if (nodo.nodeType === 3) {           // nodo de texto suelto
        var v = traduccion(nodo.textContent.trim());
        if (v) nodo.textContent = nodo.textContent.replace(nodo.textContent.trim(), v);
        return;
      }
      if (nodo.nodeType !== 1) return;     // comentarios y demás, fuera
      var w = document.createTreeWalker(nodo, NodeFilter.SHOW_TEXT), n;
      while ((n = w.nextNode())) {
        var t = n.textContent.trim();
        var r = traduccion(t);
        if (r) n.textContent = n.textContent.replace(t, r);
      }
      /* Los placeholders son atributos, no nodos de texto. Y ojo:
         `querySelectorAll` solo mira DESCENDIENTES, así que el propio
         nodo insertado hay que comprobarlo aparte — si el <input> es
         justo lo que se inserta, por ahí se escapaba. */
      var campos = [];
      if (nodo.hasAttribute && nodo.hasAttribute('placeholder')) campos.push(nodo);
      if (nodo.querySelectorAll) {
        var dentro = nodo.querySelectorAll('[placeholder]');
        for (var k = 0; k < dentro.length; k++) campos.push(dentro[k]);
      }
      for (var i = 0; i < campos.length; i++) {
        var p = traduccion((campos[i].getAttribute('placeholder') || '').trim());
        if (p) campos[i].setAttribute('placeholder', p);
      }
    }

    new MutationObserver(function (ms) {
      for (var i = 0; i < ms.length; i++) {
        var m = ms[i];
        if (m.type === 'characterData') { pasada(m.target); continue; }
        for (var j = 0; j < m.addedNodes.length; j++) pasada(m.addedNodes[j]);
      }
    }).observe(document.documentElement, {
      childList: true, subtree: true, characterData: true
    });

    // y una pasada de arranque, por lo que ya estuviera puesto
    function arranque() { pasada(document.body); }
    if (document.body) arranque();
    else document.addEventListener('DOMContentLoaded', arranque);
  }

  /* ============================================================
     16 · CONSENTIMIENTO DE COOKIES — todas las páginas
     ============================================================
     Art. 22.2 LSSI: nada que no sea técnico se instala antes de que
     la clienta lo acepte, y rechazar tiene que costar lo mismo que
     aceptar. De ahí:

       · «Rechazar todas» y «Aceptar todas» son dos botones iguales,
         mismo tamaño, mismo color, uno al lado del otro.
       · Sin consentimiento por seguir navegando, por hacer scroll o
         por cerrar: si no elige, no hay permiso.
       · Dos categorías opcionales, apagadas de entrada:
           analitica → mapa de calor y estadísticas (Clarity)
           marketing → medir los anuncios (píxel y API de Meta)
       · No bloquea la página (no hay muro de cookies): es una barra
         abajo, y el enlace a la política sigue funcionando.
       · Se puede cambiar cuando quiera desde «Configurar cookies»,
         que se añade solo al pie, junto a «Política de cookies».
       · La elección caduca a los 12 meses y se vuelve a preguntar.

     ESTE BLOQUE NO INSTALA NINGÚN PÍXEL NI CLARITY. Solo guarda la
     decisión y la anuncia. Quien cargue un script de terceros tiene
     que preguntar ANTES a la API:

         window.muraConsent.permite('marketing')  → true / false
         window.muraConsent.alCambiar(function (estado) { … })
           (se llama al momento si ya hay decisión, y en cada cambio)
         window.addEventListener('mura:consent', …)   // lo mismo

     y no cargar nada mientras sea false. Si la clienta retira el
     permiso, aquí se borran las cookies conocidas (_clck, _clsk,
     _fbp, _fbc); el script ya cargado habrá que descargarlo con una
     recarga, que es lo que hace quien lo cargó.

     Se guarda en localStorage (`mura_consent`), no en una cookie: es
     el registro de la elección, no hace falta mandarlo al servidor.
     Si el navegador no deja escribir, la elección vale solo para esa
     página y el banner volverá a salir: mejor eso que dar por buena
     una elección que no se guardó.

     La API la define el primero de los dos pegables que corra
     (el HEAD, normalmente); el otro la reutiliza. */

     `disabled`; en la prueba del 3/9 se vio que el clic SÍ llega a
     GHL y sale su aviso, así que el enganche bueno es el aviso, no
     el botón. El `pointer-events: none` de la sección 4 se queda por
     si alguna versión sí lo deshabilita: ese clic se pesca aquí por
     coordenadas.

     Qué se hace, y cuándo:

       · Al pulsar el botón de avanzar/pagar —en fase de captura,
         antes de que GHL valide— se re-emite `input`/`change` en
         cada campo CON valor: si el problema era el autorrelleno, la
         validación ya lo ve relleno y pasa.
       · Cuando GHL pinta su aviso (.alert-danger fuera del resumen;
         el del cupón no cuenta) se marcan los campos obligatorios
         vacíos (.mura-falta) y se lleva la vista al primero.

     La marca se quita en cuanto se escribe en el campo. Si GHL
     repinta el formulario y se la lleva por delante, no pasa nada:
     el siguiente intento la vuelve a poner. */

  function vigilarCheckout() {
    var SEL_BOTON = "button[class*='checkout']:not(.checkout-breadcrumb-item), .payment-btn";

    /* El buscador de dirección es una ayuda, no un dato del pedido;
       las notas son <textarea> y quedan fuera del selector. El cupón
       vive en el resumen, no en .checkout-form. */
    function campos() {
      return Array.prototype.slice.call(document.querySelectorAll(
        '.checkout-form input, .checkout-form select, .email-field input, .phone-input input'
      )).filter(function (c) {
        if (c.type === 'checkbox' || c.type === 'radio' || c.type === 'hidden') return false;
        if (/busca/i.test(c.getAttribute('placeholder') || '')) return false;
        /* El selector de poblaciones de la sección 13 es una ayuda. */
        if (c.classList.contains('mura-cp-otras')) return false;
        return true;
      });
    }

    function envoltorio(c) {
      return c.closest('.checkout-form > div, .email-field, .phone-input') || c.parentElement;
    }

    /* El aviso de validación de GHL, si está pintado. El del cupón
       también es .alert-danger pero vive en el resumen: no cuenta. */
    function avisoGHL() {
      var als = document.querySelectorAll('.alert-danger');
      for (var i = 0; i < als.length; i++) {
        if (!als[i].closest('.hl-cart-summary-container')) return als[i];
      }
      return null;
    }

    /* Un campo es obligatorio si su envoltorio lleva el asterisco
       (.required-field); si esta versión del checkout no pintara
       asteriscos, se toman todos. */
    function senalar() {
      var hayAsteriscos = !!document.querySelector(
        '.checkout-form .required-field, .email-field .required-field, .phone-input .required-field'
      );
      var vacios = campos().filter(function (c) {
        if (c.value && c.value.trim() !== '') return false;
        var w = envoltorio(c);
        return hayAsteriscos ? !!(w && w.querySelector('.required-field')) : true;
      });
      if (!vacios.length) return;
      vacios.forEach(function (c) { c.classList.add('mura-falta'); });
      vacios[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    document.addEventListener('click', function (e) {
      var boton = e.target.closest ? e.target.closest(SEL_BOTON) : null;
      var apagado = false;
      if (!boton) {
        /* Un botón disabled de verdad no recibe el clic: con el
           pointer-events:none de la sección 4 cae en el envoltorio y
           se localiza por coordenadas. */
        document.querySelectorAll(SEL_BOTON).forEach(function (b) {
          if (!b.disabled) return;
          var r = b.getBoundingClientRect();
          if (r.width && e.clientX >= r.left && e.clientX <= r.right &&
              e.clientY >= r.top && e.clientY <= r.bottom) { boton = b; apagado = true; }
        });
      }
      if (!boton) return;

      /* Poner al día el estado de GHL con lo que ya está escrito.
         Corre en captura: llega antes que el manejador que valida. */
      campos().forEach(function (c) {
        if (c.value && c.value.trim() !== '') {
          c.dispatchEvent(new Event('input', { bubbles: true }));
          c.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });

      if (apagado) senalar();
      /* Si el aviso de GHL ya estaba pintado de un intento anterior,
         reenseñarlo no muta el DOM y el observer de abajo no salta:
         se repasa también aquí, un instante después de que valide. */
      else setTimeout(function () { if (avisoGHL()) senalar(); }, 150);
    }, true);

    /* Cada vez que GHL pinta su aviso, se señalan los campos. */
    new MutationObserver(function (ms) {
      for (var i = 0; i < ms.length; i++) {
        for (var j = 0; j < ms[i].addedNodes.length; j++) {
          var n = ms[i].addedNodes[j];
          if (n.nodeType !== 1) continue;
          var al = (n.matches && n.matches('.alert-danger')) ? n
                 : (n.querySelector ? n.querySelector('.alert-danger') : null);
          if (al && !al.closest('.hl-cart-summary-container')) { senalar(); return; }
        }
      }
    }).observe(document.body, { childList: true, subtree: true });

    document.addEventListener('input', function (e) {
      var c = e.target;
      if (c && c.classList && c.classList.contains('mura-falta') && c.value.trim() !== '') {
        c.classList.remove('mura-falta');
      }
    }, true);
  }

  /* ============================================================
     11 · El EDITAR del resumen del checkout va directo a /carrito
     ============================================================
     El control .edit-cart de GHL navega a /cart, su página nativa
     de carrito. La redirección /cart→/carrito de la sección 0 la
     salva, pero solo cuando el Tracking Code de ESA página llega a
     ejecutarse —GHL lo inyecta al final de la carga, el mismo
     retraso del 2/9—, así que la clienta veía el carrito nativo de
     GHL varios segundos antes del salto (visto por Sonia el 3/9).

     Aquí, en cambio, el tiempo juega a favor: cuando la clienta
     pulsa EDITAR, el global lleva rato cargado. Se le pesca el
     clic en captura y se va directo a /carrito sin pisar /cart.
     Con href y no replace: el "atrás" debe devolver al checkout.
     La sección 0 se queda como red de seguridad, y
     web/cart-redireccion.html (pegado dentro de la propia página
     /cart) es el segundo cinturón para los enlaces que no pasen
     por aquí.

     No choca con el listener de clics de la sección 10: aquel solo
     actúa cuando el clic cae en el botón de avanzar apagado. */

  function desviarEditar() {
    document.addEventListener('click', function (ev) {
      var el = ev.target;
      if (!el || !el.closest) return;
      var editar = el.closest('.edit-cart, a[href="/cart"], a[href^="/cart?"]');
      if (!editar) return;
      ev.preventDefault();
      if (ev.stopImmediatePropagation) ev.stopImmediatePropagation();
      else ev.stopPropagation();
      location.href = '/carrito';
    }, true);
  }

  /* ============================================================
     13 · Dirección por código postal (19/9)
     ============================================================
     Pedido de Sonia: España ya elegida en País, el código postal
     ANTES que ciudad y provincia, y que un CP español de 5 cifras
     rellene las dos. Si el CP tiene varias poblaciones se pone la
     primera y se ofrecen las demás. Todo sigue siendo editable, y
     si algo falla —los datos no cargan, el CP no se conoce— el
     formulario se rellena a mano como siempre: nada de lo que hace
     GHL depende de esto.

     El formulario real (capturado el 19/9, está en
     tienda/pruebas/fixtures/): País y Provincia son <select>
     NATIVOS —`country` con códigos ISO de país, `state` con los de
     provincia: SE, H, M…—, y `state` solo existe cuando el país
     elegido tiene provincias: Vue lo pinta un instante DESPUÉS de
     elegir país, por eso la provincia se reintenta en cada pasada
     del observer hasta que aparece.

       · PROVINCIA: sale de las dos primeras cifras del CP, con la
         tabla de abajo; no necesita datos de fuera. Se busca la
         opción por su código y, si GHL los cambiara, por su nombre
         (sin tildes ni mayúsculas, con los dos nombres de las que
         tienen dos). Falla en un puñado de enclaves de frontera; el
         campo queda editable.
       · CIUDAD: de tienda/datos/cp-es.json (GeoNames, CC-BY 4.0),
         alojado en la librería de medios de GHL —URL_CP— y pedido
         una sola vez, al primer foco en el CP.
       · VARIAS POBLACIONES: un <select class="mura-cp-otras"> bajo
         el campo Ciudad. No es un <datalist>: en móvil el datalist
         solo sugiere lo que casa con lo ya escrito, y con la primera
         población puesta no ofrecería ninguna otra.

     GHL (Vue) no se entera de un `.value =` a secas: cada valor se
     pone con `input` + `change` + `blur`. El `blur` no es de
     adorno: GHL recalcula las tarifas de envío en el blur de
     ciudad y CP, y sin él «Forma de envío» no aparece (comprobado
     en vivo el 19/9).

     No pisar a la clienta: solo se actúa cuando CAMBIA el CP, y la
     ciudad solo se escribe si está vacía o si la pusimos nosotros.
     La provincia sí se pone siempre que cambia el CP: el prefijo
     manda, y dejar la de un CP anterior sería un error en la
     etiqueta.

     FUERA DE ESPAÑA no se compra por la web (decisión de Sonia, 19/9):
     el envío internacional se confirma antes por WhatsApp —lo dicen
     las condiciones de contratación—, así que con otro país elegido
     sale un «consúltanos» con el enlace encima del botón de avanzar y
     el botón se apaga. Se apaga con `disabled` y, por si Vue se lo
     quita al repintar, el clic se le corta también en captura. Solo
     se vuelve a encender el botón que apagamos nosotros.

     El orden visual lo cambia el CSS (bloque `tienda`, con `order`);
     aquí se acompasa el tabulador, que si no seguiría el orden del
     DOM: dirección → país → provincia → ciudad → CP.

     Pruebas: tienda/pruebas/direccion-cp.test.js */

  function direccionPorCP() {
    var URL_CP = 'https://assets.cdn.filesafe.space/NxPF5fOicowujokEk5Hm/media/cd38d82d-beea-43d5-8939-873dae4b58b2.json';

    /* Prefijo del CP → código de la opción en GHL + nombre(s). */
    var PROV = {
      '01': 'VI Álava/Araba', '02': 'AB Albacete', '03': 'A Alicante/Alacant',
      '04': 'AL Almería', '05': 'AV Ávila', '06': 'BA Badajoz',
      '07': 'PM Balears/Illes Balears/Baleares/Islas Baleares', '08': 'B Barcelona',
      '09': 'BU Burgos', '10': 'CC Cáceres', '11': 'CA Cádiz',
      '12': 'CS Castellón/Castelló', '13': 'CR Ciudad Real', '14': 'CO Córdoba',
      '15': 'C A Coruña/La Coruña', '16': 'CU Cuenca', '17': 'GI Girona/Gerona',
      '18': 'GR Granada', '19': 'GU Guadalajara', '20': 'SS Guipúzcoa/Gipuzkoa',
      '21': 'H Huelva', '22': 'HU Huesca', '23': 'J Jaén', '24': 'LE León',
      '25': 'L Lleida/Lérida', '26': 'LO La Rioja', '27': 'LU Lugo', '28': 'M Madrid',
      '29': 'MA Málaga', '30': 'MU Murcia', '31': 'NA Navarra/Nafarroa',
      '32': 'OR Ourense/Orense', '33': 'O Asturias', '34': 'P Palencia',
      '35': 'GC Las Palmas', '36': 'PO Pontevedra', '37': 'SA Salamanca',
      '38': 'TF Santa Cruz de Tenerife', '39': 'S Cantabria', '40': 'SG Segovia',
      '41': 'SE Sevilla', '42': 'SO Soria', '43': 'T Tarragona', '44': 'TE Teruel',
      '45': 'TO Toledo', '46': 'V Valencia/València', '47': 'VA Valladolid',
      '48': 'BI Vizcaya/Bizkaia', '49': 'ZA Zamora', '50': 'Z Zaragoza',
      '51': 'CE Ceuta', '52': 'ML Melilla'
    };

    var WHATSAPP = 'https://wa.me/34637681234?text=' +
      encodeURIComponent('Hola MÛRA, me gustaría hacer un pedido con envío fuera de España');
    var SEL_BOTON = '.payment-btn';

    var datos = null, pidiendo = false, intentos = 0, cola = [];

    function llano(s) {
      return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
    }
    function campo(form, nombre) { return form.querySelector('[name=' + nombre + ']'); }
    function formDe(el) { return el && el.closest ? el.closest('.checkout-form') : null; }

    /* Lo que se recuerda de cada formulario: el último CP aplicado,
       la ciudad que pusimos, si la provincia ya está puesta, las
       poblaciones del selector y el último país visto. Vive en el
       nodo: si Vue lo recrea se pierde, y no pasa nada. */
    function memoria(form) {
      return form._muraCP || (form._muraCP = { cp: '', ciudad: null, provincia: true, lista: null, pais: null });
    }

    function poner(c, valor) {
      c.value = valor;
      c.dispatchEvent(new Event('input', { bubbles: true }));
      c.dispatchEvent(new Event('change', { bubbles: true }));
      c.dispatchEvent(new Event('blur'));
    }

    /* Dos intentos como mucho: si la red falla al primer foco, el
       siguiente cambio de CP lo vuelve a probar, y ahí se queda. */
    function pedirDatos(luego) {
      if (datos) { if (luego) luego(); return; }
      if (luego) cola.push(luego);
      if (pidiendo || intentos >= 2 || !window.fetch) return;
      pidiendo = true;
      intentos++;
      window.fetch(URL_CP).then(function (r) {
        if (!r.ok) throw new Error('cp ' + r.status);
        return r.json();
      }).then(function (d) {
        datos = d;
        pidiendo = false;
        var c = cola;
        cola = [];
        c.forEach(function (f) { f(); });
      }).catch(function () { pidiendo = false; cola = []; });
    }

    function opcionProvincia(sel, ficha) {
      var corte = ficha.indexOf(' ');
      var codigo = ficha.slice(0, corte);
      var nombres = ficha.slice(corte + 1).split('/').map(llano);
      var i, o;
      for (i = 0; i < sel.options.length; i++) if (sel.options[i].value === codigo) return sel.options[i];
      for (i = 0; i < sel.options.length; i++) {
        o = sel.options[i];
        if (o.value && nombres.indexOf(llano(o.textContent)) !== -1) return o;
      }
      return null;
    }

    function provincia(form) {
      var m = memoria(form);
      if (m.provincia) return;
      var pais = campo(form, 'country'), sel = campo(form, 'state');
      if (!pais || pais.value !== 'ES' || !sel || !sel.options) return;
      var o = opcionProvincia(sel, PROV[m.cp.slice(0, 2)]);
      if (!o) return;                       /* aún con las opciones de otro país */
      m.provincia = true;
      if (sel.value !== o.value) poner(sel, o.value);
    }

    function quitarOtras(form) {
      memoria(form).lista = null;
      var s = form.querySelector('.mura-cp-otras');
      if (s && s.parentElement) s.parentElement.removeChild(s);
    }

    function pintarOtras(form) {
      var lista = memoria(form).lista, city = campo(form, 'city');
      if (!lista || !city || !city.parentElement || form.querySelector('.mura-cp-otras')) return;
      var s = document.createElement('select');
      s.className = 'mura-cp-otras';
      s.setAttribute('aria-label', 'Otras poblaciones con este código postal');
      var o = document.createElement('option');
      o.value = '';
      o.disabled = true;
      o.selected = true;
      o.textContent = 'Ver las ' + lista.length + ' poblaciones';
      s.appendChild(o);
      lista.forEach(function (nombre) {
        var op = document.createElement('option');
        op.value = nombre;
        op.textContent = nombre;
        s.appendChild(op);
      });
      city.parentElement.appendChild(s);
    }

    function ciudad(form, cp) {
      var m = memoria(form);
      if (m.cp !== cp) return;              /* el CP cambió mientras llegaban los datos */
      var city = campo(form, 'city');
      if (!city) return;
      var lista = datos[cp];
      var nuestra = m.ciudad !== null && city.value === m.ciudad;
      if (!lista || !lista.length) {
        /* CP desconocido: la ciudad del CP anterior ya no vale. */
        if (nuestra && city.value !== '') poner(city, '');
        m.ciudad = null;
        return;
      }
      if (city.value.trim() === '' || nuestra) {
        m.ciudad = lista[0];
        if (city.value !== lista[0]) poner(city, lista[0]);
      }
      if (lista.length > 1) {
        m.lista = lista;
        pintarOtras(form);
      }
    }

    function aplicar(form) {
      var pais = campo(form, 'country'), zip = campo(form, 'zipcode');
      if (!pais || !zip || pais.value !== 'ES') return;
      var cp = zip.value.trim(), m = memoria(form);
      if (cp === m.cp || !/^\d{5}$/.test(cp) || !PROV[cp.slice(0, 2)]) return;
      m.cp = cp;
      m.provincia = false;
      quitarOtras(form);
      provincia(form);
      pedirDatos(function () { ciudad(form, cp); });
    }

    function cambioDePais(form, pais) {
      var m = memoria(form), antes = m.pais;
      m.pais = pais.value;
      bloqueo();
      if (pais.value === 'ES') {
        m.cp = '';
        aplicar(form);
        return;
      }
      m.cp = '';
      m.provincia = true;
      quitarOtras(form);
      if (antes !== 'ES') return;           /* de Portugal a Francia no se borra lo escrito */
      var city = campo(form, 'city'), sel = campo(form, 'state');
      if (city && city.value !== '') poner(city, '');
      if (sel && sel.value !== '') poner(sel, '');
      m.ciudad = null;
    }

    /* ---------- Fuera de España: consúltanos ---------- */

    function paisFuera() {
      var pais = document.querySelector('.checkout-form [name=country]');
      return !!pais && pais.value !== '' && pais.value !== 'ES';
    }

    function bloqueo() {
      var fuera = paisFuera();
      var botones = document.querySelectorAll(SEL_BOTON);
      for (var i = 0; i < botones.length; i++) {
        var b = botones[i];
        /* El botón tiene dos dueños: esta sección (país) y la 14 (punto
           Nacex Shop pendiente). Cada una lleva su marca y, al soltar,
           deja el botón como lo quiera la otra. Un botón apagado por GHL
           mismo (sin marca de nadie) no se toca. */
        if (fuera) {
          if (!b.disabled || b._muraBloqueadoShop) { b.disabled = true; b._muraBloqueado = true; }
        } else if (b._muraBloqueado) {
          b._muraBloqueado = false;
          b.disabled = !!b._muraBloqueadoShop;
        }
      }
      var aviso = document.querySelector('.mura-cp-fuera');
      if (!fuera) {
        if (aviso && aviso.parentElement) aviso.parentElement.removeChild(aviso);
        return;
      }
      if (aviso || !botones.length) return;
      aviso = document.createElement('p');
      aviso.className = 'mura-cp-fuera';
      aviso.setAttribute('role', 'status');
      aviso.appendChild(document.createTextNode(
        'Para envíos fuera de España, consúltanos: te confirmamos el coste y el plazo antes de hacer el pedido. '));
      var a = document.createElement('a');
      a.href = WHATSAPP;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'Escríbenos por WhatsApp';
      aviso.appendChild(a);
      botones[0].parentElement.insertBefore(aviso, botones[0]);
    }

    /* ---------- El tabulador sigue al orden visual ---------- */

    function reordenado() {
      return !!(window.CSS && window.CSS.supports && window.CSS.supports('selector(:has(*))'));
    }
    function trasElCP(zip) {
      var raiz = document.querySelector('.hl-store-checkout-container') || document.body;
      var todos = Array.prototype.slice.call(raiz.querySelectorAll('input, select, textarea, button, a[href]'))
        .filter(function (c) { return !c.disabled && c.type !== 'hidden' && !c.classList.contains('mura-cp-otras'); });
      var i = todos.indexOf(zip);
      return i === -1 ? null : todos[i + 1] || null;
    }
    function alTabular(e) {
      if (e.key !== 'Tab' || e.altKey || e.ctrlKey || e.metaKey) return;
      var zip = document.querySelector('.checkout-form [name=zipcode]');
      var form = formDe(zip);
      if (!form || !reordenado()) return;
      var fila = [campo(form, 'address'), zip, campo(form, 'city'), form.querySelector('.mura-cp-otras'),
                  campo(form, 'country'), campo(form, 'state'), trasElCP(zip)]
        .filter(function (c) { return !!c; });
      var i = fila.indexOf(e.target);
      var destino = i === -1 ? null : fila[i + (e.shiftKey ? -1 : 1)];
      if (!destino) return;
      e.preventDefault();
      destino.focus();
    }

    /* ---------- Enganches: por delegación, Vue repinta los nodos ---------- */

    function pasada() {
      var forms = document.querySelectorAll('.checkout-form');
      for (var i = 0; i < forms.length; i++) {
        var form = forms[i], pais = campo(form, 'country');
        if (!pais) continue;
        var m = memoria(form);
        /* España por defecto: una vez por nodo, y solo si está sin elegir. */
        if (pais.value === '' && !pais._muraPais && pais.querySelector('option[value=ES]')) {
          pais._muraPais = true;
          poner(pais, 'ES');
        }
        if (m.pais === null && pais.value !== '') m.pais = pais.value;
        provincia(form);
        pintarOtras(form);
      }
      bloqueo();
    }

    document.addEventListener('focusin', function (e) {
      var c = e.target, form = formDe(c);
      if (!form || c.name !== 'zipcode') return;
      var pais = campo(form, 'country');
      if (pais && pais.value === 'ES') pedirDatos();
    }, true);

    function alEscribir(e) {
      var c = e.target, form = formDe(c);
      if (form && c.name === 'zipcode') aplicar(form);
    }
    document.addEventListener('input', alEscribir, true);

    document.addEventListener('change', function (e) {
      var c = e.target, form = formDe(c);
      if (!form) return;
      if (c.name === 'country') cambioDePais(form, c);
      else if (c.name === 'zipcode') aplicar(form);
      else if (c.classList && c.classList.contains('mura-cp-otras') && c.value) {
        var city = campo(form, 'city');
        if (city) {
          memoria(form).ciudad = c.value;
          poner(city, c.value);
        }
        c.selectedIndex = 0;
      }
    }, true);

    document.addEventListener('keydown', alTabular, true);

    document.addEventListener('click', function (e) {
      if (!paisFuera() || !e.target.closest || !e.target.closest(SEL_BOTON)) return;
      e.preventDefault();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      else e.stopPropagation();
    }, true);

    pasada();
    new MutationObserver(pasada).observe(document.body, { childList: true, subtree: true });
  }

  /* ============================================================
     14 · PANEL DE PUNTOS NACEX.SHOP EN /checkout (28/9)
     ============================================================
     La tarifa «Recogida en punto Nacex Shop» (gratis siempre) necesita
     un dato que el checkout de GHL no sabe pedir: EN QUÉ PUNTO. Al
     marcarla se despliega, debajo de la lista de tarifas, la lista de
     puntos del CP de envío: nombre, dirección, horario de hoy, «Ver en
     mapa» y «Elegir». Hay una caja para buscar por otro CP.

     Los datos vienen de n8n (workflow «N04b · Puntos Nacex Shop», en
     Mura-GHL), que a su vez pregunta a Nacex:
       GET  URL_PUNTOS?cp=41001 → {ok, puntos:[{codigo, nombre, direccion,
            poblacion, cp, telefono, horario:{l,m,x,j,v,s,d}, lat, lng}]}
       POST URL_SELECCION {email, cp_busqueda, codigo} → {ok, texto}
     El POST guarda la elección POR EMAIL en una tabla de n8n: cuando
     la clienta paga todavía no existe el pedido, y es «01 Compra»
     quien, al llegar el pedido, busca el punto por el email y lo copia
     a la oportunidad. Por eso el email es el puente y por eso, si
     cambia después de elegir, se vuelve a guardar. El POST va como
     text/plain: sin preflight CORS, una petición menos.

     CERRADO POR DEFECTO: con Shop marcada, el botón de continuar está
     apagado hasta que n8n confirma {ok:true}. Si n8n no responde, no
     hay puntos o falla el guardado, la clienta ve un aviso claro y la
     salida siempre es «Envío a tu puerta». Nunca se paga con Shop sin
     punto guardado; y si aun así ocurriera (otro email al pagar), lo
     recogen «01 Compra» (aviso a Telegram) y el 04 (se niega a llamar
     a Nacex).

     El punto elegido se recuerda en sessionStorage —sobrevive a una
     recarga— pero se RECONFIRMA con n8n antes de encender el botón:
     lo que manda es la tabla de n8n, no el navegador.

     GHL preselecciona la tarifa más barata y lista primero: como la
     recogida es gratis, se devolvería a toda clienta a Shop con el
     botón apagado. Por eso, hasta que la clienta toque la lista (o
     traiga un punto guardado), se marca «Envío a tu puerta» con un
     click real sobre su radio y la recogida se coloca la última (1/10).

     La tarifa se reconoce por su NOMBRE (`.item-name` del radio
     marcado, o `.shipping-name-label` del resumen), sin tildes ni
     mayúsculas, con NOMBRE_SHOP. Si Sonia la rebautiza y deja de
     contener «nacex shop», hay que cambiarlo aquí.

     El botón lo comparte con la sección 13 (fuera de España): cada
     una lleva su marca (`_muraBloqueado` / `_muraBloqueadoShop`) y al
     soltar deja el botón como lo quiera la otra. Como Vue puede
     repintar el botón, el clic se corta además en captura.

     Pruebas: tienda/pruebas/puntos-shop.test.js
     (fixture real: tienda/pruebas/fixtures/checkout-tarifas.html) */

  function puntosNacexShop() {
    var URL_PUNTOS = 'https://n8n.letsbebanana.com/webhook/puntos-nacex-shop';
    var URL_SELECCION = 'https://n8n.letsbebanana.com/webhook/seleccion-punto-shop';
    var NOMBRE_SHOP = 'nacex shop';
    var SEL_BOTON = '.payment-btn';
    var CLAVE = 'mura_punto';
    var DIAS = ['d', 'l', 'm', 'x', 'j', 'v', 's'];

    var TXT = {
      titulo: 'Elige tu punto de recogida',
      buscar: 'Buscar',
      cargando: 'Buscando puntos cerca de ti…',
      elegir: 'Elegir',
      mapa: 'Ver en mapa',
      cambiar: 'Cambiar',
      recoges: 'Recoges tu pedido en: ',
      pie: 'Elige un punto para continuar.',
      sinPuntos: 'No hay puntos Nacex Shop para ese código postal. Prueba con otro o elige «Envío a tu puerta».',
      sinLista: 'Ahora mismo no podemos mostrar los puntos de recogida. Inténtalo de nuevo o elige «Envío a tu puerta».',
      reintentar: 'Reintentar',
      sinEmail: 'Escribe tu correo electrónico en «Contacto» para guardar tu punto de recogida.',
      noGuardado: 'No hemos podido guardar tu punto de recogida. Inténtalo de nuevo o elige «Envío a tu puerta».'
    };

    /* Estado de la sección. `puntos` es la lista del CP `cp`;
       `elegido` = {codigo, cp, texto, email}; `confirmado` = n8n ha
       dicho ok en ESTA visita del panel. */
    var st = { cp: '', puntos: null, cargando: false, error: null, elegido: null, confirmado: false, guardando: false, aviso: '', serie: 0 };
    /* GHL preselecciona la tarifa MÁS BARATA, y la recogida en punto es gratis
       siempre: sin esto, toda clienta entraría con Shop marcada, el panel abierto
       y el botón apagado. Hasta que la clienta toque la lista (o traiga un punto
       guardado de antes), la tarifa por defecto es «Envío a tu puerta». */
    var clientaEligio = false, cambiandoNosotros = false;

    function llano(s) {
      return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
    }
    function esShop(texto) { return llano(texto).indexOf(NOMBRE_SHOP) !== -1; }

    function shopMarcada() {
      var r = document.querySelector('input[name=shipping-option]:checked');
      if (r) {
        var fila = r.closest('.shipping-option-container') || r.parentElement;
        var nombre = fila && fila.querySelector('.item-name');
        return esShop(nombre ? nombre.textContent : (fila ? fila.textContent : ''));
      }
      var etiqueta = document.querySelector('.shipping-name-label');
      return !!etiqueta && esShop(etiqueta.textContent);
    }
    /* Sin lista de tarifas (p. ej. el paso de pago tras una recarga, si GHL
       lo conservara) no hay dónde elegir punto: bloquear ahí sería un
       callejón sin salida. La elección ya vive en la tabla de n8n, y si no,
       «01 Compra» avisa. */
    function hayLista() { return !!document.querySelector('.shipping-container .shipping-options-wrapper'); }
    function pendiente() { return shopMarcada() && hayLista() && !(st.elegido && st.confirmado); }

    function etiquetaDe(radio) { return radio.closest('.shipping-option-container') || radio.parentElement; }
    function nombreDe(radio) {
      var fila = etiquetaDe(radio), n = fila && fila.querySelector('.item-name');
      return n ? n.textContent : (fila ? fila.textContent : '');
    }
    function radiosTarifa() { return Array.prototype.slice.call(document.querySelectorAll('input[name=shipping-option]')); }

    /* Devuelve a «Envío a tu puerta» cuando Shop está marcada sin que la clienta
       la haya elegido. El click() real hace que GHL (Vue) recalcule el envío. */
    function devolverADomicilio() {
      var rs = radiosTarifa(), casa = null;
      for (var i = 0; i < rs.length; i++) if (!esShop(nombreDe(rs[i]))) { casa = rs[i]; break; }
      if (!casa || casa.checked) return false;
      cambiandoNosotros = true;
      try { casa.click(); } finally { cambiandoNosotros = false; }
      return true;
    }
    /* La recogida en punto, la última de la lista (la lista es flex en columna, CSS del bloque tienda). */
    function ordenarTarifas() {
      var rs = radiosTarifa();
      for (var i = 0; i < rs.length; i++) {
        var et = etiquetaDe(rs[i]), orden = esShop(nombreDe(rs[i])) ? '1' : '';
        if (et && et.style.order !== orden) et.style.order = orden;
      }
    }

    function campo(nombre) { return document.querySelector('.checkout-form [name=' + nombre + ']'); }
    function emailActual() {
      var c = campo('email');
      var v = c ? String(c.value || '').trim().toLowerCase() : '';
      return v || (st.elegido && st.elegido.email) || '';
    }
    function cpEnvio() {
      var c = campo('zipcode');
      var v = c ? String(c.value || '').trim() : '';
      return /^\d{5}$/.test(v) ? v : '';
    }

    function leerGuardado() {
      try {
        var g = JSON.parse(window.sessionStorage.getItem(CLAVE) || 'null');
        return g && g.codigo ? g : null;
      } catch (e) { return null; }
    }
    function guardar(p) {
      try {
        if (p) window.sessionStorage.setItem(CLAVE, JSON.stringify(p));
        else window.sessionStorage.removeItem(CLAVE);
      } catch (e) { /* sin sessionStorage: se elige de nuevo tras recargar */ }
    }

    /* ---------- Botón de continuar ---------- */

    function bloqueo() {
      var pend = pendiente();
      var bs = document.querySelectorAll(SEL_BOTON);
      for (var i = 0; i < bs.length; i++) {
        var b = bs[i];
        if (pend) {
          b._muraBloqueadoShop = true;
          b.disabled = true;
        } else if (b._muraBloqueadoShop) {
          b._muraBloqueadoShop = false;
          b.disabled = !!b._muraBloqueado;
        }
      }
    }

    /* ---------- Red ---------- */

    function pedirPuntos(cp) {
      st.cp = cp;
      st.puntos = null;
      st.error = null;
      st.aviso = '';
      if (!window.fetch) { st.error = 'sin_fetch'; pintar(); return; }
      st.cargando = true;
      var serie = ++st.serie;
      pintar();
      window.fetch(URL_PUNTOS + '?cp=' + encodeURIComponent(cp)).then(function (r) {
        return r.json();
      }).then(function (d) {
        if (serie !== st.serie) return;
        st.cargando = false;
        if (!d || !d.ok || !d.puntos) { st.error = (d && d.motivo) || 'sin_respuesta'; }
        else st.puntos = d.puntos;
        pintar();
      }).catch(function () {
        if (serie !== st.serie) return;
        st.cargando = false;
        st.error = 'sin_respuesta';
        pintar();
      });
    }

    /* Guarda (o reconfirma) el punto en n8n. `reconfirma` = venía
       guardado de antes: si n8n lo rechaza se descarta sin más aviso. */
    function enviarSeleccion(punto, cp, reconfirma) {
      var email = emailActual();
      if (!email) {
        st.aviso = TXT.sinEmail;
        pintar();
        return;
      }
      if (!window.fetch) { st.aviso = TXT.noGuardado; pintar(); return; }
      st.guardando = true;
      st.confirmado = false;   /* hasta el ok de ESTE guardado (email nuevo incluido) no se paga */
      st.aviso = '';
      pintar();
      var cuerpo = JSON.stringify({ email: email, cp_busqueda: cp, codigo: punto.codigo });
      window.fetch(URL_SELECCION, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: cuerpo }).then(function (r) {
        return r.json();
      }).then(function (d) {
        st.guardando = false;
        if (d && d.ok) {
          st.elegido = { codigo: punto.codigo, cp: cp, texto: d.texto || textoDe(punto), email: email };
          st.confirmado = true;
          guardar(st.elegido);
        } else {
          fallo(reconfirma);
        }
        pintar();
      }).catch(function () {
        st.guardando = false;
        fallo(reconfirma);
        pintar();
      });
    }
    function fallo(reconfirma) {
      if (reconfirma) {
        st.elegido = null;
        st.confirmado = false;
        guardar(null);
        if (st.puntos === null && !st.cargando) pedirPuntos(cpEnvio() || st.cp);
      } else {
        st.aviso = TXT.noGuardado;
      }
    }

    /* ---------- Pintado ---------- */

    function el(tag, clase, texto) {
      var n = document.createElement(tag);
      if (clase) n.className = clase;
      if (texto) n.textContent = texto;
      return n;
    }
    function textoDe(p) {
      return [p.nombre, p.direccion, [p.cp, p.poblacion].filter(Boolean).join(' ')].filter(Boolean).join(' · ');
    }
    function hoy(p) {
      var h = p.horario && p.horario[DIAS[new Date().getDay()]];
      return h ? 'Hoy: ' + h : 'Hoy cerrado';
    }

    function filaPunto(p) {
      var fila = el('div', 'mura-punto');
      var datos = el('div', 'mura-punto-datos');
      datos.appendChild(el('div', 'mura-punto-nombre', p.nombre || ''));
      datos.appendChild(el('div', 'mura-punto-dir', [p.direccion, [p.cp, p.poblacion].filter(Boolean).join(' ')].filter(Boolean).join(' · ')));
      var hoyEl = el('div', 'mura-punto-hoy', hoy(p));
      if (typeof p.lat === 'number' && typeof p.lng === 'number' && !isNaN(p.lat) && !isNaN(p.lng)) {
        var a = el('a', 'mura-punto-mapa', TXT.mapa);
        a.href = 'https://www.google.com/maps?q=' + p.lat + ',' + p.lng;
        a.target = '_blank';
        a.rel = 'noopener';
        hoyEl.appendChild(a);
      }
      datos.appendChild(hoyEl);
      fila.appendChild(datos);
      var b = el('button', 'mura-punto-elegir', TXT.elegir);
      b.type = 'button';
      b.addEventListener('click', function () { enviarSeleccion(p, st.cp, false); });
      fila.appendChild(b);
      return fila;
    }

    function pintar() {
      var panel = document.querySelector('.mura-puntos');
      if (!panel) return;
      while (panel.firstChild) panel.removeChild(panel.firstChild);

      if (st.elegido) {
        var e = el('div', 'mura-punto-elegido');
        e.appendChild(el('span', 'mura-punto-elegido-titulo', TXT.recoges));
        e.appendChild(el('span', 'mura-punto-elegido-texto', st.elegido.texto));
        var c = el('a', 'mura-punto-cambiar', TXT.cambiar);
        c.href = '#';
        c.addEventListener('click', function (ev) {
          ev.preventDefault();
          st.elegido = null;
          st.confirmado = false;
          guardar(null);
          if (st.puntos === null && !st.cargando) pedirPuntos(st.cp || cpEnvio());
          pintar();
          bloqueo();
        });
        e.appendChild(c);
        panel.appendChild(e);
        if (st.aviso) panel.appendChild(el('p', 'mura-puntos-aviso', st.aviso));
        bloqueo();
        return;
      }

      panel.appendChild(el('p', 'mura-puntos-titulo', TXT.titulo));
      var busca = el('div', 'mura-puntos-busca');
      var caja = el('input', 'mura-puntos-cp');
      caja.type = 'text';
      caja.setAttribute('inputmode', 'numeric');
      caja.setAttribute('maxlength', '5');
      caja.setAttribute('aria-label', 'Código postal');
      caja.placeholder = 'Código postal';
      caja.value = st.cp;
      var bb = el('button', 'mura-puntos-buscar', TXT.buscar);
      bb.type = 'button';
      function buscar() {
        var v = String(caja.value || '').trim();
        if (/^\d{5}$/.test(v)) pedirPuntos(v);
      }
      bb.addEventListener('click', buscar);
      caja.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); buscar(); } });
      busca.appendChild(caja);
      busca.appendChild(bb);
      panel.appendChild(busca);

      if (st.cargando || st.guardando) {
        panel.appendChild(el('p', 'mura-puntos-cargando', TXT.cargando));
      } else if (st.error) {
        var av = el('p', 'mura-puntos-aviso', TXT.sinLista + ' ');
        var re = el('a', 'mura-puntos-reintentar', TXT.reintentar);
        re.href = '#';
        re.addEventListener('click', function (ev) { ev.preventDefault(); pedirPuntos(st.cp || cpEnvio()); });
        av.appendChild(re);
        panel.appendChild(av);
      } else if (st.puntos && !st.puntos.length) {
        panel.appendChild(el('p', 'mura-puntos-aviso', TXT.sinPuntos));
      } else if (st.puntos) {
        var lista = el('div', 'mura-puntos-lista');
        for (var i = 0; i < st.puntos.length; i++) lista.appendChild(filaPunto(st.puntos[i]));
        panel.appendChild(lista);
      }
      if (st.aviso) panel.appendChild(el('p', 'mura-puntos-aviso', st.aviso));
      panel.appendChild(el('p', 'mura-puntos-pie', TXT.pie));
      bloqueo();
    }

    /* ---------- Montar / desmontar ---------- */

    function montar() {
      var cont = document.querySelector('.shipping-container');
      var lista = cont && cont.querySelector('.shipping-options-wrapper');
      if (!lista) return;
      var panel = el('div', 'mura-puntos');
      panel.setAttribute('role', 'region');
      panel.setAttribute('aria-label', TXT.titulo);
      if (lista.nextSibling) cont.insertBefore(panel, lista.nextSibling);
      else cont.appendChild(panel);

      if (!st.elegido) st.elegido = leerGuardado();
      /* Un punto guardado = la clienta eligió Shop antes (recarga): aunque n8n lo
         rechace después, se queda en Shop con la lista, no se la devuelve a casa. */
      if (st.elegido) clientaEligio = true;
      st.confirmado = false;
      var cp = cpEnvio();
      if (st.elegido) {
        pintar();
        enviarSeleccion({ codigo: st.elegido.codigo }, st.elegido.cp || cp, true);
      } else if (cp && cp !== st.cp) {
        pedirPuntos(cp);
      } else if (st.puntos === null && !st.cargando) {
        if (cp || st.cp) pedirPuntos(cp || st.cp);
        else { st.error = 'sin_cp'; pintar(); }
      } else {
        pintar();
      }
    }
    function desmontar() {
      var panel = document.querySelector('.mura-puntos');
      if (panel && panel.parentElement) panel.parentElement.removeChild(panel);
      st.confirmado = false;
      st.aviso = '';
    }

    function pasada() {
      ordenarTarifas();
      if (shopMarcada() && !clientaEligio && !st.elegido && !leerGuardado() && devolverADomicilio()) return;
      var hay = !!document.querySelector('.mura-puntos');
      if (shopMarcada()) { if (!hay) montar(); }
      else if (hay) desmontar();
      bloqueo();
    }

    /* ---------- Enganches: por delegación, Vue repinta los nodos ---------- */

    document.addEventListener('change', function (e) {
      var c = e.target;
      if (!c || !c.name) return;
      if (c.name === 'shipping-option') { if (!cambiandoNosotros) clientaEligio = true; pasada(); }
      else if (c.name === 'email' && st.elegido && shopMarcada()) {
        var email = String(c.value || '').trim().toLowerCase();
        if (email && email !== st.elegido.email) enviarSeleccion({ codigo: st.elegido.codigo }, st.elegido.cp, false);
      }
    }, true);

    document.addEventListener('click', function (e) {
      if (!pendiente() || !e.target.closest || !e.target.closest(SEL_BOTON)) return;
      e.preventDefault();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      else e.stopPropagation();
    }, true);

    pasada();
    new MutationObserver(pasada).observe(document.body, { childList: true, subtree: true });
  }

  /* ============================================================
     8 · BOCADILLO MÓVIL — donde haya cabecera .mura-nav
     ============================================================
     En móvil (≤719 px) el menú de la cabecera se esconde entero y en
     su lugar sale el botón de dos rayitas, que al abrirse giran 45° y
     forman la X.

     Hasta el 1/9 esto era un pegable APARTE (web/tracking-bocadillo
     .html) que iba pegado a mano debajo del Tracking Code del BODY.
     Al repegar el body entero se perdió sin que nada avisara, así
     que ahora vive aquí dentro: el BODY es UN solo bloque y no hay
     segunda pieza que olvidar.

     El panel se rellena clonando los enlaces de `.mura-links` de la
     propia cabecera: no hay una segunda lista de menú que mantener.

     DESDE EL 3/10 LA CABECERA DE LAS PÁGINAS DE web/ TRAE SU BOCADILLO.
     GHL inyecta este código al final de la carga, y hasta entonces la
     página pintaba su menú a medio esconder: Sonia veía «Prendas» en
     la cabecera del móvil unos segundos, y luego el salto a las
     rayitas. Ahora la cabecera vive una sola vez en
     web/global/cabecera.html (elemento universal de GHL, sale en el
     HTML inicial) y lleva el botón, este mismo CSS y un oyente gemelo
     del de abajo (misma bandera `window.muraBocadillo`, así nunca hay
     dos y un clic no se anula con otro). Esta sección queda para las
     cabeceras que inyecta el propio global (rutas de tienda) y como
     red si la cabecera pierde su script.
     Pruebas: `pruebas/bocadillo.test.js`.

     El CSS (`bocadilloCss`) está definido junto al sistema de diseño y
     se inyecta ya en la parte HEAD; al montar el botón se repite la
     llamada por si el BODY va solo. El oyente va delegado en el
     documento y crea el panel al primer clic: aguanta que GHL repinte
     la cabecera al hidratar. */

  function montarBocadillo() {
    if (!window.muraBocadillo) {
      window.muraBocadillo = 1;
      document.addEventListener('click', function (e) {
        var b = e.target.closest && e.target.closest('.mura-burger');
        if (!b) return;
        var nav = b.closest('.mura-nav');
        var links = nav && nav.querySelector('.mura-links');
        if (!links) return;
        var m = nav.querySelector('.mura-mnav');
        if (!m) {
          m = document.createElement('div');
          m.className = 'mura-mnav';
          m.innerHTML = links.innerHTML;
          nav.appendChild(m);
        }
        var o = m.classList.toggle('open');
        b.classList.toggle('open', o);
        b.setAttribute('aria-expanded', o ? 'true' : 'false');
      });
    }

    function montar() {
      var nav = document.querySelector('.mura-nav');
      if (!nav) return false;
      /* La página ya trae su botón en el HTML (las de web/): no se monta otro. */
      if (nav.querySelector('.mura-burger')) return true;
      var dentro = nav.querySelector('.mura-nav-in');
      var links = nav.querySelector('.mura-links');
      if (!dentro || !links) return false;
      estilo('bocadillo', bocadilloCss);
      var b = document.createElement('button');
      b.className = 'mura-burger';
      b.type = 'button';
      b.setAttribute('aria-label', 'Menú');
      b.setAttribute('aria-expanded', 'false');
      b.innerHTML = '<span></span><span></span>';
      dentro.appendChild(b);
      return true;
    }

    /* La cabecera puede inyectarse después (la monta init() más abajo,
       incluso con retraso de 1200 ms): se espera a que aparezca, con
       tope para no dejar un observer vivo en páginas sin cabecera. */
    if (!montar()) {
      var obs = new MutationObserver(function () { if (montar()) obs.disconnect(); });
      obs.observe(document.documentElement, { childList: true, subtree: true });
      setTimeout(function () { obs.disconnect(); }, 10000);
    }
  }

  montarBocadillo();

  /* ============================================================
     15 · AVISO DEL 10 % DE LA NEWSLETTER (29/9)
     ============================================================
     Pedido de Sonia: que nada más entrar se vea que la newsletter da
     un 10 % en la primera compra. Un panel entra deslizándose por el
     borde izquierdo al segundo de cargar; a los seis segundos se
     encoge hacia ese borde y queda una pestaña negra, pegada y fija
     (acompaña al hacer scroll), con «10 %» escrito en vertical de
     abajo arriba. Pulsar la pestaña vuelve a abrir el panel, y abierto
     a mano ya no se recoge solo. La equis, «Ahora no» y Escape lo
     recogen: no lo quitan.

     El botón NO lleva formulario: va al de la newsletter de la home
     (/#mura-nl). En la propia home baja hasta él sin recargar y deja
     el cursor en el correo; al llegar desde otra página con #mura-nl
     en la URL, también.

     CUÁNDO SALE
       · El panel entero solo la primera página de cada visita
         (sessionStorage mura_dto_visto); en las siguientes aparece ya
         la pestaña, sin animación, para no cansar.
       · La pestaña, siempre, hasta que la persona se suscribe: el
         formulario de la home deja localStorage mura_dto = 'suscrita'
         y desde entonces no se monta.
       · Nunca en el checkout, el carrito, las páginas de gracias, la
         baja, la suscripción confirmada, la encuesta, la solicitud de
         devolución ni las legales (RUTAS_SIN_AVISO): ahí se está
         haciendo otra cosa.

     ESTÉTICA: la de la web. Blanco roto, raya fina, título en serif,
     botón negro sin esquinas y sin subrayado, «Ahora no» en gris
     pequeño. En móvil el panel es claramente más pequeño que la
     pantalla (82 % del ancho, en el tercio inferior) y la pestaña baja
     con él para no tapar el titular de la portada.

     Va todo con clases .mura-dto-*, fuera de <div class="mura">
     (vive en el body, fijo), así que trae su tipografía y su
     box-sizing. El CSS se inyecta desde aquí, al montar: el aviso lo
     crea este script, no hay HTML que pueda pintar antes.

     Pruebas: tienda/pruebas/aviso-10.test.js */

  var RUTAS_SIN_AVISO = ['/checkout', '/carrito', '/cart', '/thank-you', '/gracias',
    '/gracias-devolucion', '/cancelar_suscripcion', '/suscripcion-confirmada',
    '/experiencia', '/devolucion', '/aviso-legal', '/politica-privacidad',
    '/politica-cookies', '/condiciones-contratacion'];

  var avisoCss = [
    ".mura-dto { position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 60; pointer-events: none; font-family: 'Jost', sans-serif; font-weight: 300; color: #1D1B18; line-height: 1.5; -webkit-font-smoothing: antialiased; }",
    '.mura-dto, .mura-dto * { box-sizing: border-box; }',
    /* el panel: entra desde fuera del borde y, al recogerse, se encoge hacia él */
    '.mura-dto-panel { pointer-events: auto; position: relative; width: min(360px, calc(100vw - 40px)); background: #F0EEE8; border: 1px solid rgba(29,27,24,.14); border-left: none; box-shadow: 0 18px 50px rgba(24,22,19,.14); padding: 46px 40px 40px; outline: none; transform: translateX(-105%); opacity: 0; transform-origin: left center; transition: transform .6s cubic-bezier(.2,.7,.2,1), opacity .45s ease; }',
    '.mura-dto.abierto .mura-dto-panel { transform: translateX(0); opacity: 1; }',
    '.mura-dto.recogido .mura-dto-panel { transform: scale(.13, .37); opacity: 0; pointer-events: none; transition: transform .5s cubic-bezier(.6,0,.4,1), opacity .3s ease .2s; }',
    '.mura-dto-l { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: #8A857B; margin-bottom: 18px; }',
    '.mura-dto-raya { width: 32px; height: 1px; background: #1D1B18; margin-bottom: 22px; }',

    '.mura-dto-p { font-size: 14px; line-height: 1.9; color: #55524B; margin: 0 0 28px; }',
    ".mura-dto-btn, .mura-dto-btn:hover, .mura-dto-btn:visited { display: flex; align-items: center; justify-content: center; height: 52px; background: #1D1B18; color: #F0EEE8 !important; text-decoration: none !important; font-family: 'Jost', sans-serif; font-size: 11.5px; letter-spacing: .24em; text-transform: uppercase; font-weight: 300; transition: background .2s ease; }",
    '.mura-dto-btn:hover { background: #38352F; }',
    ".mura-dto-no { display: block; width: 100%; margin-top: 18px; padding: 4px 0; background: none; border: none; cursor: pointer; text-align: center; font-family: 'Jost', sans-serif; font-weight: 300; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #8A857B; text-decoration: none; }",
    '.mura-dto-no:hover { color: #1D1B18; }',
    ".mura-dto-x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; background: none; border: none; cursor: pointer; font-family: 'Jost', sans-serif; font-weight: 200; font-size: 22px; line-height: 1; color: #8A857B; }",
    '.mura-dto-x:hover { color: #1D1B18; }',
    /* la pestaña: aparece cuando el panel ya se ha encogido */
    '.mura-dto-tab { pointer-events: auto; position: absolute; left: 0; top: 50%; width: 46px; height: 132px; margin: 0; padding: 0; border: none; background: #1D1B18; color: #F0EEE8; cursor: pointer; display: flex; align-items: center; justify-content: center; transform: translate(-100%, -50%); opacity: 0; transition: transform .45s ease .3s, opacity .3s ease .3s; }',
    '.mura-dto.recogido .mura-dto-tab { transform: translate(0, -50%); opacity: 1; }',
    ".mura-dto-tab span { writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; letter-spacing: .18em; white-space: nowrap; }",
    '.mura-dto-tab:hover { background: #38352F; }',
    /* segunda página de la visita: la pestaña ya está, sin entrar */
    '.mura-dto.sin-animar, .mura-dto.sin-animar * { transition: none !important; }',
    '@media (prefers-reduced-motion: reduce) { .mura-dto, .mura-dto * { transition: none !important; } }',

    '@media (max-width: 719px) {',
    '  .mura-dto { top: auto; bottom: 12vh; transform: none; }',
    '  .mura-dto-panel { width: min(320px, 82vw); padding: 36px 30px 30px; }',
