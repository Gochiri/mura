  function montarAviso10() {
    var CLAVE = 'mura_dto';              /* localStorage: 'suscrita' → no sale más */
    var CLAVE_VISTO = 'mura_dto_visto';  /* sessionStorage: el panel ya entró en esta visita */
    var ENTRA = 1000, SE_RECOGE = 6000;
    var esHome = path === '';

    /* Al llegar a la home desde el aviso de otra página (/#mura-nl), el
       navegador ya baja hasta el formulario; aquí solo se deja el cursor
       en el correo. Va antes de cualquier salida: pasa también si el aviso
       ya no se monta. */
    if (esHome && location.hash === '#mura-nl') {
      var correo0 = document.getElementById('mnl-email');
      if (correo0) { try { correo0.focus({ preventScroll: true }); } catch (e) {} }
    }

    if (RUTAS_SIN_AVISO.indexOf(path) !== -1) return;
    /* Con el banner de cookies sin contestar, el aviso espera a que la
       clienta elija (23/10): en móvil salían los dos a la vez y el
       banner (sección 16) tapaba el panel. Al decidir se monta, y el
       segundo de entrada cuenta desde ahí. */
    var ck = window.muraConsent;
    if (ck && !ck.estado().decidido) {
      var esperando = true;
      ck.alCambiar(function () { if (esperando) { esperando = false; montarAviso10(); } });
      return;
    }
    /* El BODY de GHL corre con el body ya pintado; el guardia es por si
       alguien ejecuta la fuente entera desde el <head>. */
    if (!document.body) { document.addEventListener('DOMContentLoaded', montarAviso10); return; }
    if (document.querySelector('.mura-dto')) return;
    try { if (localStorage.getItem(CLAVE) === 'suscrita') return; } catch (e) {}
    var visto = false;
    try { visto = sessionStorage.getItem(CLAVE_VISTO) === '1'; } catch (e) {}

    estilo('aviso10', avisoCss);

    var raiz = document.createElement('div');
    raiz.className = 'mura-dto';
    raiz.innerHTML =
      '<div class="mura-dto-panel" role="dialog" aria-label="Newsletter: 10 % en tu primera compra" tabindex="-1">' +
        '<button type="button" class="mura-dto-x" aria-label="Cerrar">×</button>' +
        '<div class="mura-dto-l">Newsletter</div>' +
        '<div class="mura-dto-raya"></div>' +
        '<p class="mura-dto-t">10 % en tu primera compra.</p>' +
        '<p class="mura-dto-p">Suscríbete y disfruta de los beneficios de nuestra newsletter desde el primer pedido.</p>' +
        '<a class="mura-dto-btn" href="/#mura-nl">Quiero mi descuento</a>' +
        '<button type="button" class="mura-dto-no">Ahora no</button>' +
      '</div>' +
      '<button type="button" class="mura-dto-tab" aria-label="Ver el 10 % de descuento de la newsletter"><span>10 %</span></button>';
    document.body.appendChild(raiz);

    var panel = raiz.querySelector('.mura-dto-panel');
    var temporizador = null;

    function abrir(solo) {
      clearTimeout(temporizador);
      raiz.classList.remove('sin-animar');
      raiz.classList.remove('recogido');
      raiz.classList.add('abierto');
      try { sessionStorage.setItem(CLAVE_VISTO, '1'); } catch (e) {}
      /* Solo la entrada automática se recoge sola; abierto a mano se
         queda hasta que lo cierren. */
      if (solo) temporizador = setTimeout(recoger, SE_RECOGE);
      else { try { panel.focus({ preventScroll: true }); } catch (e) {} }
    }
    function recoger() {
      clearTimeout(temporizador);
      temporizador = null;
      raiz.classList.remove('abierto');
      raiz.classList.add('recogido');
    }

    raiz.querySelector('.mura-dto-tab').addEventListener('click', function () { abrir(false); });
    raiz.querySelector('.mura-dto-x').addEventListener('click', recoger);
    raiz.querySelector('.mura-dto-no').addEventListener('click', recoger);
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && raiz.classList.contains('abierto')) recoger();
    });
    raiz.querySelector('.mura-dto-btn').addEventListener('click', function (ev) {
      if (!esHome) return; /* fuera de la home el enlace navega a /#mura-nl */
      /* Por id con almohadilla, a propósito: poda-css.js toma por clase
         cualquier `mura-…` que salga en el código, salvo si va tras `#`. */
      var form = document.querySelector('#mura-nl');
      if (!form) return;
      ev.preventDefault();
      recoger();
      try { form.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
      var correo = document.getElementById('mnl-email');
      if (correo) { try { correo.focus({ preventScroll: true }); } catch (e) {} }
    });

    if (visto) {
      raiz.classList.add('sin-animar');
      raiz.classList.add('recogido');
    } else {
      temporizador = setTimeout(function () { abrir(true); }, ENTRA);
    }
  }

  montarAviso10();

  if (!esTienda) return;

  /* ============================================================
     7 · Cabecera y pie en las páginas de tienda
     ============================================================
     Usa las MISMAS clases que la cabecera del resto del sitio
     (`.mura-nav`), que ahora viven en la parte 1. Antes esto tenía
     su propio `.mura-nav-inject` con su propio CSS: dos cabeceras
     distintas que había que mantener a la vez y que ya habían
     divergido —el orden del menú no coincidía y a esta le faltaba
     el contador del carrito—. */

  function init() {
    if (document.querySelector('.mura-nav')) return;

    var nav = document.createElement('nav');
    nav.className = 'mura-nav';
    nav.innerHTML = '<div class="mura-nav-in">' +
      '<a href="/" class="mura-logo">MÛRA</a>' +
      '<div class="mura-links">' +
        '<a href="/">Inicio</a>' +
        '<a href="/colecciones" class="hm">Colecciones</a>' +
        '<a href="/prendas">Prendas</a>' +
        '<a href="/novedades" class="hm">Novedades</a>' +
        '<a href="/mura" class="hm">MÛRA</a>' +
        '<a href="/contacto" class="hm">Contacto</a>' +
      '</div>' +
      '<a href="/carrito" class="mura-cart">Carrito<span class="mura-cart-w" style="display:none"> (<span class="mura-cart-n">0</span>)</span></a>' +
      '</div>';
    document.body.insertBefore(nav, document.body.firstChild);

    // Ocultar la cabecera del tema (la que trae Logo / Business Name)
    document.querySelectorAll('header, nav, [class*="header"]').forEach(function (h) {
      if (!h.contains(nav) && !nav.contains(h) && /Business Name/i.test(h.textContent)) h.style.display = 'none';
    });

    /* El pie, el mismo de las páginas de web/ (1/9). Va al final del body;
       sus reglas viven en la parte 1 y no dependen de `.mura`. El guardia
       sobra mientras init() solo corra sin `.mura-nav`, pero protege si
       algún día una ruta de tienda trae su propio pie. */
    if (!document.querySelector('.mura-foot')) {
      var pie = document.createElement('footer');
      pie.className = 'mura-foot';
      pie.innerHTML = '<div class="mura-foot-in">' +
        '<div class="mura-foot-cols">' +
        '<div><div class="mura-foot-h">Explorar</div><div class="mura-foot-c"><a href="/">Inicio</a><a href="/colecciones">Colecciones</a><a href="/prendas">Prendas</a><a href="/novedades">Novedades</a></div></div>' +
        '<div><div class="mura-foot-h">MÛRA</div><div class="mura-foot-c"><a href="/mura">Nuestra esencia</a><a href="/contacto">Contacto</a></div></div>' +
        '<div><div class="mura-foot-h">Información</div><div class="mura-foot-c"><a href="/devoluciones">Envíos y devoluciones</a><a href="/politica-privacidad">Política de privacidad</a><a href="/politica-cookies">Política de cookies</a><a href="/condiciones-contratacion">Condiciones de contratación</a><a href="/aviso-legal">Aviso legal</a></div></div>' +
        '<div><div class="mura-foot-h">Redes</div><div class="mura-foot-c"><a href="https://www.instagram.com/bymurastudio/" target="_blank" rel="noopener">Instagram</a></div></div>' +
        '</div>' +
        '<div style="height:1px;background:rgba(29,27,24,.1);margin:clamp(60px,7vw,90px) 0 0"></div>' +
        '<div style="text-align:center;padding:clamp(60px,7vw,90px) 0 28px;display:flex;flex-direction:column;gap:20px;align-items:center">' +
        '<p class="mura-serif" style="font-size:clamp(22px,2.2vw,28px);font-style:italic">Vestir con intención.</p>' +
        '<div class="mura-serif" style="font-size:20px;font-weight:500;letter-spacing:.32em">MÛRA</div>' +
        '</div>' +
        '<p style="text-align:center;font-size:10.5px;letter-spacing:.14em;color:#9B968C">© MÛRA 2026 · Todos los derechos reservados.</p>' +
        '</div>';
      document.body.appendChild(pie);
    }

    pintarContador();

    /* Los textos ya no se tocan aquí: de eso se encarga la sección 9,
       que corre desde el HEAD y llega antes de que se pinten. Este
       observer se queda solo con el contador del carrito. */
    new MutationObserver(pintarContador)
      .observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
  setTimeout(init, 1200); // por si el tema pinta tarde
})();

/* ============================================================
   NOTA · LOS TEXTOS VAN EN EL ELEMENTO, NO EN JS

   Los elementos Cart y Checkout guardan sus textos como ajustes
   propios. Leídos por API el 22/8, así están:

     · Cart     — los SEIS en inglés ("My cart", "Your Cart is
                  empty", "Continue Shopping"…).
     · Checkout — traducido casi entero, con tres cabos: el
                  placeholder de las notas en inglés, varios
                  regionalismos de América ("domicilio", "agregar",
                  "regresar") y "Codigo Postal" sin tilde.

   La sección 9 los arregla desde el HEAD, así que hoy se ven bien.
   Pero el sitio bueno sigue siendo el ajuste del elemento: salen
   traducidos de origen, sin depender de que corra un script.

   NO SE PUDO HACER POR API (22/8). El contenido de una página se
   LEE en `GET /funnels/page/{pageId}` (backend interno, token-id;
   el PIT da 401 ahí) y el JSON del elemento vive en el
   `pageDataUrl` de Firebase. Para ESCRIBIR no hay ruta alcanzable:
   POST/PUT/PATCH sobre /funnels/page/{id} y sus variantes
   (/data, /save, /sections, /funnel/{id}/page/{id}…) responden
   "Cannot POST", que es ruta inexistente, no permiso denegado. El
   builder guarda por otra vía y app.gohighlevel.com no se alcanza
   desde el entorno para averiguar cuál.

   Así que esta lista es para pegar A MANO. El día que se haga, la
   sección 9 se queda sin trabajo y se puede borrar entera.

   ---- Página Cart → elemento Cart → Settings ----
     headline               → Tu selección
     emptyCartText          → Aún no has seleccionado ninguna pieza.
     continueShopping       → Descubrir colección
     subtotalColumnHeading  → Subtotal
     totalColumnHeading     → Total
     checkoutButtonText     → Completar pedido

   ---- Página Checkout → elemento Checkout → Settings ----
   Migas
     step1Label                  → Datos y envío
     step2Label                  → Pago
     continueToPaymentText       → Continuar al pago
     returnToContactShippingText → Volver a datos y envío
   Contacto
     headline                    → Contacto
     email                       → Correo electrónico
   Envío
     headline                    → Datos de envío
     fullName                    → Nombre y apellidos
     phoneNumber                 → Teléfono
     searchBoxPlaceholder        → Busca tu dirección
     fullAddress                 → Dirección completa
     country                     → País
     state                       → Provincia
     cityName                    → Ciudad
     zipCode                     → Código postal
     notesHeadingLabelText       → Añadir una nota al pedido
     notesTextBoxPlaceholder     → Indicaciones para la entrega
     shippingMethodsHeadline     → Forma de envío
     freeShippingLabelText       → Gratis
   Facturación
     headline                    → Datos de facturación
     checkboxText                → La dirección de facturación es la misma que la de envío
   Pago
     headline                    → Pago
     checkoutButtonText          → Confirmar pedido
     footerText                  → Pago seguro
   Resumen
     headline                    → Tu pedido
     editCartButtonText          → Editar
     emptyCartText               → Aún no has seleccionado ninguna pieza.
     continueShopping            → Descubrir colección
       ⚠️ El texto que trae GHL por defecto es una traducción automática
       —"Las plantas rodadoras son espectaculares, pero este carrito anda
       en busca de algo más emocionante"— que además trata de usted cuando
       el resto de la web tutea. El dibujo del carrito con hojas verdes ya
       se oculta desde el CSS; el texto solo se cambia aquí.
     quantityColumnHeading       → Ud.
     couponHeadline              → Código de descuento
     couponCodePlaceholder       → Introduce tu código
     applyCouponButtonText       → Aplicar
     subtotalColumnHeading       → Subtotal
     discountHeading             → Descuento
     removeCouponButtonText      → Quitar
     shippingHeading             → Envío
     totalColumnHeading          → Total
   ============================================================ */
</script>
