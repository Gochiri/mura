<!--
  ============================================================
  MÛRA · NEWSLETTER (sección para el final de /home)
  ============================================================
  CÓMO SE PEGA
  Va dentro del elemento de código de la página Home, DENTRO del
  <div class="mura">, justo ANTES del <footer class="mura-foot">.
  Se pega desde <section hasta </section> con su <script>.

  Requiere el Tracking Code global ya pegado (las reglas
  .mura-nl-* viven ahí; esta sección no trae CSS).

  QUÉ HACE
  Campos propios con el diseño de la web que envían AL FORMULARIO
  REAL de GHL ("Opt-in Newsletter", fmuHvvOjkGBAkPU2LTZN) por su
  endpoint público de envíos — el mismo que usa el widget oficial.
  Así el envío queda en Forms → Submissions, el contacto se crea
  con sus campos mapeados (incluida la fecha de cumpleaños) y el
  trigger "form submitted" del LS02 dispara. Sin iframe: el CSS
  de la página no puede entrar en un iframe, y así no hace falta.

  El checkbox RGPD es obligatorio para enviar (se valida aquí).
  Los dos consentimientos SMS en inglés del formulario de GHL no
  se envían ni se muestran: son opcionales y solo existían dentro
  del widget.

  CONTRATO DEL ENDPOINT — calcado de una captura real (15/8) de
  lo que envía el widget oficial (Network → submit → 201):
  POST /forms/submit?formId=…&locationId=…  multipart con
    formData (JSON con todos los campos), locationId, formId y
    turnstileNonInteractiveToken (Turnstile invisible).
  La primera versión fallaba por dos motivos: mandaba los campos
  sueltos en vez del JSON, y la fecha como date_of_birth cuando el
  formulario la guarda en el custom FGlE7RDztTinTetJGgWI.
  Si un envío falla, el detalle queda en la consola del navegador
  (F12) con el prefijo "MURA newsletter".
  ============================================================
-->
<section class="mura-nl" id="mura-nl">
  <div class="mura-label" style="margin-bottom:14px">Newsletter</div>
  <h2 class="mura-serif" style="font-size:clamp(28px,3.4vw,40px);font-weight:400">Las cápsulas, antes que nadie.</h2>
  <p style="margin-top:18px;font-size:14.5px;line-height:1.9;color:#55524B">Cada colección existe una sola vez. Déjanos tu correo y te avisamos cuando una nueva cápsula esté a punto de salir.</p>

  <form id="mnl-form" novalidate>
    <div class="mura-nl-fila">
      <div class="mura-nl-campo"><label for="mnl-nombre">Nombre</label><input id="mnl-nombre" name="first_name" type="text" autocomplete="given-name"></div>
      <div class="mura-nl-campo"><label for="mnl-apellido">Apellidos</label><input id="mnl-apellido" name="last_name" type="text" autocomplete="family-name"></div>
    </div>
    <div class="mura-nl-campo"><label for="mnl-email">Correo electrónico *</label><input id="mnl-email" name="email" type="email" autocomplete="email" required></div>
    <div class="mura-nl-fila">
      <div class="mura-nl-campo"><label for="mnl-tel">Teléfono *</label><input id="mnl-tel" name="phone" type="tel" autocomplete="tel" required></div>
      <div class="mura-nl-campo"><label for="mnl-fecha">Fecha de nacimiento</label><input id="mnl-fecha" name="date_of_birth" type="date"></div>
    </div>
    <label class="mura-nl-consent"><input id="mnl-rgpd" type="checkbox">
      <span>He leído y acepto la <a href="/politica-privacidad">política de privacidad</a>. MÛRA usará estos datos solo para enviarme sus novedades; puedo darme de baja en cualquier momento.</span>
    </label>
    <button type="submit" class="mura-btn" id="mnl-btn">Quiero enterarme</button>
    <div class="mura-nl-estado" id="mnl-estado" role="status" aria-live="polite"></div>
  </form>
</section>
<div id="mnl-ts" style="position:absolute;width:0;height:0;overflow:hidden"></div>
<div id="mnl-ts2" style="display:none;margin:0 0 18px 0"></div>
<script>(function(){
var FORM_ID='fmuHvvOjkGBAkPU2LTZN';
var LOC_ID='NxPF5fOicowujokEk5Hm';
/* Campo custom del formulario donde vive la fecha de cumpleanos.
   NO es date_of_birth: el builder creo un campo propio y el widget
   envia su id — leido de una captura real del 15/8. */
var CAMPO_FECHA='FGlE7RDztTinTetJGgWI';
/* Turnstile de Cloudflare, con la MISMA coreografia que el widget
   oficial: token fresco al enviar + las cabeceras x-turnstile-* que
   acompanan al envio (sin ellas el backend valida contra el secreto
   equivocado y responde 429 "invalid-input-secret" — visto el 15/8).
   Si aun asi rechaza, se reintenta UNA vez con la clave visible,
   mostrando el recuadro de verificacion sobre el boton. */
var TS_INVISIBLE='0x4AAAAAACCpVlau-4k7cJ33';
var TS_VISIBLE='0x4AAAAAACDfuwSBQ2sYO1VD';
var tsWidget=null, tsResolve=null, tsLoadMs=null;
var tsT0=Date.now();
window.__mnlTS=function(){
 tsLoadMs=Date.now()-tsT0;
 try{
  tsWidget=turnstile.render('#mnl-ts',{sitekey:TS_INVISIBLE, execution:'execute',
    callback:function(t){if(tsResolve){var r=tsResolve;tsResolve=null;r(t);}},
    'error-callback':function(){if(tsResolve){var r=tsResolve;tsResolve=null;r('');}},
    'expired-callback':function(){try{turnstile.reset(tsWidget)}catch(e){}}});
 }catch(e){}
};
var tss=document.createElement('script');
tss.src='https://challenges.cloudflare.com/turnstile/v0/api.js?onload=__mnlTS&render=explicit';
tss.async=true; document.head.appendChild(tss);

function tokenInvisible(){
 return new Promise(function(res){
  if(!window.turnstile||tsWidget===null){res({tok:'',wait:0});return;}
  var t0=Date.now(), hecho=false;
  tsResolve=function(t){if(!hecho){hecho=true;res({tok:t,wait:Date.now()-t0});}};
  try{turnstile.reset(tsWidget);turnstile.execute(tsWidget);}catch(e){if(!hecho){hecho=true;tsResolve=null;res({tok:'',wait:0});}}
  setTimeout(function(){if(!hecho){hecho=true;tsResolve=null;res({tok:'',wait:Date.now()-t0});}},8000);
 });
}
function tokenVisible(){
 return new Promise(function(res){
  if(!window.turnstile){res('');return;}
  var box=document.getElementById('mnl-ts2');
  box.style.display='block';
  var hecho=false;
  try{
   turnstile.render('#mnl-ts2',{sitekey:TS_VISIBLE,
    callback:function(t){if(!hecho){hecho=true;box.style.display='none';res(t);}},
    'error-callback':function(){if(!hecho){hecho=true;box.style.display='none';res('');}}});
  }catch(e){box.style.display='none';res('');return;}
  setTimeout(function(){if(!hecho){hecho=true;box.style.display='none';res('');}},60000);
 });
}

function uuid(){try{return crypto.randomUUID()}catch(e){return 'xxxx-xxxx-4xxx-yxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)})}}
function tzNombre(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Madrid'}catch(e){return 'Europe/Madrid'}}
function tzTexto(){
 var m=-new Date().getTimezoneOffset(), s=m<0?'-':'+', a=Math.abs(m);
 return tzNombre()+' (GMT'+s+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0')+')';
}
var t0=Date.now();
var form=document.getElementById('mnl-form');
var estado=document.getElementById('mnl-estado');
var btn=document.getElementById('mnl-btn');
function msg(t,err){estado.textContent=t;estado.className='mura-nl-estado'+(err?' err':'');}

function enviar(tok,waitMs){
 var sid=uuid();
 var datos={
  first_name:document.getElementById('mnl-nombre').value.trim(),
  last_name:document.getElementById('mnl-apellido').value.trim(),
  phone:document.getElementById('mnl-tel').value.trim(),
  email:document.getElementById('mnl-email').value.trim(),
  formId:FORM_ID,
  location_id:LOC_ID,
  sessionId:sid,
  eventData:{
   source:'direct', referrer:document.referrer||'', adSource:'', url_params:{},
   page:{url:location.href,title:document.title||''},
   timestamp:Date.now(), campaign:'',
   contactSessionIds:{ids:[sid]},
   fbp:'', fbc:'', type:'page-visit', parentId:FORM_ID, pageVisitType:'form',
   domain:location.hostname, version:'v3', parentName:'Opt-in Newsletter',
   fingerprint:null, documentURL:location.href, gaClientId:null,
   fbEventId:uuid(), medium:'form', mediumId:FORM_ID
  },
  Timezone:tzTexto(),
  paymentContactId:{},
  timeSpent:Math.round((Date.now()-t0)/1000*1000)/1000
 };
 var f=document.getElementById('mnl-fecha').value;
 if(f)datos[CAMPO_FECHA]=f;

 var fd=new FormData();
 fd.append('formData',JSON.stringify(datos));
 fd.append('locationId',LOC_ID);
 fd.append('formId',FORM_ID);
 if(tok)fd.append('turnstileNonInteractiveToken',tok);

 /* Las mismas cabeceras que manda el widget oficial. */
 var cab={'timezone':tzNombre(),'fullurl':location.href,
  'x-turnstile-submit-delay-ms':'0',
  'x-turnstile-script-load-ms':String(tsLoadMs===null?0:tsLoadMs),
  'x-turnstile-non-interactive-wait-ms':String(waitMs||0)};

 return fetch('https://backend.leadconnectorhq.com/forms/submit?formId='+FORM_ID+'&locationId='+LOC_ID,{method:'POST',headers:cab,body:fd})
  .then(function(r){
   return r.text().then(function(txt){
    if(!r.ok){console.error('MURA newsletter: HTTP '+r.status,txt.slice(0,500));var e=new Error('HTTP '+r.status);e.http=r.status;e.detalle=txt.slice(0,300);throw e;}
    return txt;
   });
  });
}

function exito(){
 form.querySelectorAll('input,button').forEach(function(e){e.disabled=true;});
 form.style.opacity='.5';
 msg('Ya estás dentro. Te escribiremos cuando la próxima cápsula esté a punto de salir.');
}
function fallo(e){
 console.error('MURA newsletter:',e);
 btn.disabled=false;btn.style.opacity='';
 if(e&&e.http===429&&!(e.detalle||'').match(/challenge/i)){msg('Demasiados intentos seguidos. Espera un minuto y vuelve a probar.',true);}
 else{msg('No hemos podido registrar tu suscripción. Inténtalo de nuevo en unos minutos o escríbenos a hello@stylebymura.com.',true);}
}

form.addEventListener('submit',function(ev){
 ev.preventDefault();
 var email=document.getElementById('mnl-email').value.trim();
 var tel=document.getElementById('mnl-tel').value.trim();
 if(!email||email.indexOf('@')<1){msg('Escribe tu correo electrónico para poder avisarte.',true);return;}
 if(!tel){msg('Escribe tu teléfono, por favor.',true);return;}
 if(!document.getElementById('mnl-rgpd').checked){msg('Para suscribirte necesitamos que aceptes la política de privacidad.',true);return;}

 btn.disabled=true;btn.style.opacity='.55';msg('Un momento…');
 tokenInvisible().then(function(r){
  console.log('MURA newsletter: token '+(r.tok?'ok':'AUSENTE')+' ('+r.wait+' ms)');
  return enviar(r.tok,r.wait).then(exito).catch(function(e){
   /* rechazo del challenge invisible -> una oportunidad con el visible */
   if(e&&(String(e.detalle||'').match(/challenge|turnstile/i))){
    console.log('MURA newsletter: reintento con verificación visible');
    msg('Completa la verificación de seguridad, por favor.');
    return tokenVisible().then(function(tok2){
     if(!tok2)throw e;
     msg('Un momento…');
     return enviar(tok2,0).then(exito);
    });
   }
   throw e;
  });
 }).catch(fallo);
});
})();</script>
