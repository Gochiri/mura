<!--
  ============================================================
  MÛRA · NEWSLETTER (sección para el final de /home)
  · patrón Inbound Webhook, calcado de ghlteamlatam.com/apply ·
  ============================================================
  CÓMO FUNCIONA (el patrón de German, que funciona siempre)
  Campos HTML propios con el diseño de la web → POST JSON a un
  INBOUND WEBHOOK de un workflow de GHL. Ese endpoint acepta
  envíos desde cualquier dominio, sin captcha. Dentro del
  workflow, un Create/Update Contact mapea el payload a los
  campos del contacto y un Add Tag pone `nl`.

  (El endpoint del formulario /forms/submit NO sirve desde fuera:
  valida el Turnstile contra sus propios dominios — cuatro
  intentos, cuatro 429. Historia completa en la sección 28 del
  doc. El formulario Opt-in de GHL queda sin uso.)

  MONTAJE (una sola vez, en la UI de GHL):
  1. Workflows → crear "LS02a · Alta newsletter web".
  2. Trigger: **Inbound Webhook** (crearlo EN LA UI — los
     triggers creados por API no disparan). GHL genera una URL
     https://services.leadconnectorhq.com/hooks/…/webhook-trigger/…
  3. Pegar esa URL abajo donde dice PEGAR_URL_DEL_WEBHOOK.
  4. Pegar esta sección en Home (dentro del <div class="mura">,
     antes del <footer>) y hacer UN envío de prueba: ese envío le
     da a GHL el payload de ejemplo para poder mapear.
  5. En el workflow, añadir acciones:
     - Create/Update Contact:
         First Name  ← {{inboundWebhookRequest.first_name}}
         Last Name   ← {{inboundWebhookRequest.last_name}}
         Email       ← {{inboundWebhookRequest.email}}
         Phone       ← {{inboundWebhookRequest.phone}}
         Date of Birth ← {{inboundWebhookRequest.fecha_nacimiento}}
     - Add Contact Tag: `nl`
     Publicar.
  6. LS02 (bienvenida): trigger = Contact Tag Added `nl`,
     publicar.

  El checkbox RGPD es obligatorio (se valida aquí) y viaja como
  `consentimiento` en el payload, para que quede registro.
  Requiere el Tracking Code global pegado (las reglas .mura-nl-*
  viven ahí).
  ============================================================
-->
<section class="mura-nl" id="mura-nl">
  <div class="mura-label" style="margin-bottom:14px">Newsletter</div>
  <h2 class="mura-serif" style="font-size:clamp(28px,3.4vw,40px);font-weight:400">Las cápsulas, antes que nadie.</h2>
  <p style="margin-top:18px;font-size:14.5px;line-height:1.9;color:#55524B">Cada colección existe una sola vez. Déjanos tu correo y te avisamos cuando una nueva cápsula esté a punto de salir.</p>

  <form id="mnl-form" novalidate>
    <div class="mura-nl-fila">
      <div class="mura-nl-campo"><label for="mnl-nombre">Nombre</label><input id="mnl-nombre" name="first_name" type="text" autocomplete="given-name"></div>
      <div class="mura-nl-campo"><label for="mnl-apellido">Apellidos</label><input id="mnl-apellido" name="last_name" type="text" autocomplete="family-name"></div>
    </div>
    <div class="mura-nl-campo"><label for="mnl-email">Correo electrónico *</label><input id="mnl-email" name="email" type="email" autocomplete="email" required></div>
    <div class="mura-nl-fila">
      <div class="mura-nl-campo"><label for="mnl-tel">Teléfono *</label><input id="mnl-tel" name="phone" type="tel" autocomplete="tel" required></div>
      <div class="mura-nl-campo"><label for="mnl-fecha">Fecha de nacimiento</label><input id="mnl-fecha" name="fecha_nacimiento" type="date"></div>
    </div>
    <label class="mura-nl-consent"><input id="mnl-rgpd" type="checkbox">
      <span>He leído y acepto la <a href="/politica-privacidad">política de privacidad</a>. MÛRA usará estos datos solo para enviarme sus novedades; puedo darme de baja en cualquier momento.</span>
    </label>
    <button type="submit" class="mura-btn" id="mnl-btn">Quiero enterarme</button>
    <div class="mura-nl-estado" id="mnl-estado" role="status" aria-live="polite"></div>
  </form>
</section>
<script>(function(){
/* URL del Inbound Webhook del workflow "LS02a · Alta newsletter web".
   Se genera al crear el trigger en la UI de GHL (paso 2 de la cabecera). */
var WEBHOOK='PEGAR_URL_DEL_WEBHOOK';

var form=document.getElementById('mnl-form');
var estado=document.getElementById('mnl-estado');
var btn=document.getElementById('mnl-btn');
function msg(t,err){estado.textContent=t;estado.className='mura-nl-estado'+(err?' err':'');}
form.addEventListener('submit',function(ev){
 ev.preventDefault();
 var email=document.getElementById('mnl-email').value.trim();
 var tel=document.getElementById('mnl-tel').value.trim();
 if(!email||email.indexOf('@')<1){msg('Escribe tu correo electrónico para poder avisarte.',true);return;}
 if(!tel){msg('Escribe tu teléfono, por favor.',true);return;}
 if(!document.getElementById('mnl-rgpd').checked){msg('Para suscribirte necesitamos que aceptes la política de privacidad.',true);return;}
 if(WEBHOOK.indexOf('http')!==0){msg('El formulario aún no está conectado. Escríbenos a hello@stylebymura.com.',true);console.error('MURA newsletter: falta pegar la URL del webhook');return;}

 var datos={
  first_name:document.getElementById('mnl-nombre').value.trim(),
  last_name:document.getElementById('mnl-apellido').value.trim(),
  email:email,
  phone:tel,
  fecha_nacimiento:document.getElementById('mnl-fecha').value||'',
  consentimiento:'rgpd-aceptado',
  origen:'newsletter-home'
 };

 btn.disabled=true;btn.style.opacity='.55';msg('Un momento…');
 fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)})
  .then(function(r){
   if(!r.ok){console.error('MURA newsletter: HTTP '+r.status);throw new Error('HTTP '+r.status);}
   form.querySelectorAll('input,button').forEach(function(e){e.disabled=true;});
   form.style.opacity='.5';
   msg('Ya estás dentro. Te escribiremos cuando la próxima cápsula esté a punto de salir.');
  })
  .catch(function(e){
   console.error('MURA newsletter:',e);
   btn.disabled=false;btn.style.opacity='';
   msg('No hemos podido registrar tu suscripción. Inténtalo de nuevo en unos minutos o escríbenos a hello@stylebymura.com.',true);
  });
});
})();</script>
